# Generado a partir del catálogo (catalogo-servicios.md §5) y D2/D12/D14. Editar con cuidado:
# toda routing key nueva debe agregarse también a sus canales de cola.
asyncapi: 3.0.0
id: urn:com:bandadau:events
info:
  title: Bandada U — Catálogo de eventos y comandos (RabbitMQ)
  version: 1.2.0
  description: |
    Contrato asíncrono de **Bandada U** (fuente: `bandadau-docs/docs/03-arquitectura/catalogo-servicios.md` §5, `decisiones-clave.md` D2/D3/D12/D14).

    ## Topología
    | Exchange | Tipo | Uso |
    |---|---|---|
    | `bandada.events` | topic, durable | Eventos de dominio y respuestas de la SAGA (`bandada.<contexto>.<entidad>.<verbo-pasado>.v<n>`) |
    | `bandada.commands` | topic, durable | Comandos dirigidos (`bandada.<contexto>.cmd.<verbo>.v<n>`) |
    | `bandada.dlx` | topic, durable | Dead letters |

    Cada **canal de routing key** (`address` = routing key) describe un mensaje publicado en su exchange; cada **canal de cola** (`address` = nombre de cola) describe lo que recibe un consumidor según sus bindings.

    ## Sobre CloudEvents 1.0 (modo estructurado)
    Cuerpo JSON con `content-type: application/cloudevents+json`: `specversion`, `id` (UUIDv7), `source` (`/services/<servicio>`), `type` (= routing key), `time`, `subject`, `datacontenttype: application/json`, `data` y extensiones `correlationid`, `causationid`, `sagaid` (obligatoria en comandos y respuestas de la SAGA) y `traceparent` (W3C). Propiedades AMQP: `message_id` = `id`, `correlation_id` = `correlationid`, `type` = `type`, `content_type` = `application/cloudevents+json`, `delivery_mode` = 2 (persistente).

    ## Garantías
    - Publicación con **outbox** transaccional y *publisher confirms*; entrega *at-least-once*.
    - Consumo con **inbox** (`processed_messages` / `ConditionExpression`) deduplicando por `id`; ack manual.
    - Comandos con `idempotencyKey = <sagaId>:<step>`; los receptores responden lo mismo ante repeticiones.
    - Reintentos: 3 con backoff escalonado de **5 s / 30 s / 5 min** mediante colas de espera `<cola>.retry.5s|30s|5m` (TTL + dead-letter de vuelta a `bandada.events`/`bandada.commands`) gestionadas por `@bandada/messaging-ts`; agotados los reintentos (o ante mensaje inválido/desconocido) el mensaje va a `<cola>.dlq`. Las colas quorum además declaran `x-delivery-limit: 10` como red de seguridad ante reencolados.
    - Consumidores toleran campos nuevos; cambios incompatibles → nueva versión `.v2` publicada en paralelo.

    ## Dead letters (`bandada.dlx`)
    Cada cola declara `x-dead-letter-exchange: bandada.dlx` y `x-dead-letter-routing-key: <nombre-de-cola>`. Por cada cola existe `<nombre-de-cola>.dlq` (durable, `x-queue-type: quorum`) enlazada a `bandada.dlx` con routing key `<nombre-de-cola>`. Los mensajes conservan la cabecera `x-death`. El agente de monitoreo (`get_service_health`) alerta `DLQ_BACKLOG` si alguna DLQ tiene mensajes; se re-encolan manualmente desde la UI de RabbitMQ tras corregir la causa.

    ## Propuestas (`x-proposal: true`)
    Ninguna vigente: `AUTHOR_SUSPENDED` en `PostHiddenData.reason` quedó confirmado por la implementación (fase 1).

    ## Changelog
    - 1.2.0 (2026-10-15): consolidación fase 1 — `issue-ticket` agrega `organizerId` (requerido), `staffUserIds` y
      `eventEndsAt` (opcionales); las respuestas de la SAGA (`credits-*`, `ticket-*`) agregan `idempotencyKey`
      (eco del comando, opcional); `x-delivery-limit` 4 → 10; reintentos 5 s / 30 s / 5 min (antes 1/5/25 s).
    - 1.1.0 (2026-10-14): ADR-0016/D15 — eventos `bandada.ticketing.ticket-void-failed.v1`,
      `bandada.social.comment.hidden.v1` y `bandada.social.post.removed.v1`; motivos `SAGA_ABORTED`
      (`credits-debit-failed`) y `ALREADY_VOIDED` (`ticket-issue-failed`); `credits-refunded` con
      `amountCredits: 0` (*tombstone*); cola `admin-gateway.subscriptions.<instanceId>`; binding
      `bandada.events.event.cancelled.v1` en `notification-service.events`; `user.reactivated.v1`,
      `preferences-changed` y los enums dejan de ser propuestas; enums alineados con el modelo
      (`READY`, `MODERATION_ESCALATION`, `RegistrationFailureReason`, `ReportReason`, `HiddenReason`).
    - 1.0.0 (2026-10-14): versión inicial (D12 + D2 + D14).
