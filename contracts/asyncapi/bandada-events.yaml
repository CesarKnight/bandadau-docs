  qAdminGatewaySubscriptionsQueue:
    address: admin-gateway.subscriptions.{instanceId}
    title: Cola admin-gateway.subscriptions.<instanceId>
    description: |-
      Fuente de las subscriptions GraphQL del panel (`alertRaised`, `moderationQueueChanged`, `reportReady`; D11, ADR-0016). Cada réplica de `admin-gateway` declara su **propia** cola exclusiva y *auto-delete* (`instanceId` = id de la réplica, p. ej. hostname del contenedor), de modo que todas las réplicas reciben todos los eventos y los reenvían a sus clientes WebSocket. Al reiniciar la réplica la cola desaparece; no hay DLQ (los eventos perdidos se recuperan con las queries del panel).

      Dueño: `admin-gateway`. Bindings sobre `bandada.events` (catálogo §5): `bandada.media.asset.#`, `bandada.social.content.reported.v1`, `bandada.social.post.hidden.v1`, `bandada.insights.alert.raised.v1`, `bandada.insights.report.ready.v1`.
    parameters:
      instanceId:
        description: Identificador de la réplica de admin-gateway (hostname del contenedor o UUID generado al arrancar).
        examples:
        - admin-gateway-7f9c4d
    messages:
      MediaAssetApprovedV1:
        $ref: '#/components/messages/MediaAssetApprovedV1'
      MediaAssetFlaggedV1:
        $ref: '#/components/messages/MediaAssetFlaggedV1'
      MediaAssetRejectedV1:
        $ref: '#/components/messages/MediaAssetRejectedV1'
      SocialContentReportedV1:
        $ref: '#/components/messages/SocialContentReportedV1'
      SocialPostHiddenV1:
        $ref: '#/components/messages/SocialPostHiddenV1'
      InsightsAlertRaisedV1:
        $ref: '#/components/messages/InsightsAlertRaisedV1'
      InsightsReportReadyV1:
        $ref: '#/components/messages/InsightsReportReadyV1'
    x-owner: admin-gateway
    x-bindings:
    - exchange: bandada.events
      routingKey: bandada.media.asset.#
    - exchange: bandada.events
      routingKey: bandada.social.content.reported.v1
    - exchange: bandada.events
      routingKey: bandada.social.post.hidden.v1
    - exchange: bandada.events
      routingKey: bandada.insights.alert.raised.v1
    - exchange: bandada.events
      routingKey: bandada.insights.report.ready.v1
    x-queue-arguments:
      x-queue-type: classic
      x-message-ttl: 60000
    bindings:
      amqp:
        is: queue
        queue:
          name: admin-gateway.subscriptions.{instanceId}
          durable: false
          exclusive: true
          autoDelete: true
          vhost: /
        bindingVersion: 0.3.0
  deadLetterExchange:
    address: bandada.dlx
    title: Dead letter exchange
    description: Exchange `bandada.dlx` (topic, durable). Recibe los mensajes rechazados (`nack` sin requeue), expirados o
      que superan `x-delivery-limit` en cualquier cola; la routing key es el nombre de la cola de origen y el destino es `<cola>.dlq`.
      Puede contener cualquier mensaje de este catálogo.
    x-dlq-queues:
    - events-service.saga-replies.dlq
    - wallet-service.commands.dlq
    - ticketing-service.commands.dlq
    - social-service.events.dlq
    - media-service.events.dlq
    - notification-service.events.dlq
    - insights-service.analytics.dlq
    - n8n.automation.dlq
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: bandada.dlx
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
