          format: uuid
        eventId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        sagaId:
          type: string
          format: uuid
        eventTitle:
          type: string
        eventStartsAt:
          type: string
          format: date-time
        ticketId:
          type: string
          format: uuid
        priceCredits:
