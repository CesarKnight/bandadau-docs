    - $ref: '#/channels/qN8nAutomationQueue/messages/IdentityUserRegisteredV1'
    - $ref: '#/channels/qN8nAutomationQueue/messages/MediaAssetFlaggedV1'
    - $ref: '#/channels/qN8nAutomationQueue/messages/EventsEventPublishedV1'
    - $ref: '#/channels/qN8nAutomationQueue/messages/EventsRegistrationConfirmedV1'
    - $ref: '#/channels/qN8nAutomationQueue/messages/InsightsAlertRaisedV1'
