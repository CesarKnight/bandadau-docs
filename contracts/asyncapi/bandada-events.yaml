    - name: admin-gateway
    bindings:
      $ref: '#/components/operationBindings/consumeAck'
components:
  schemas:
    CloudEventEnvelope:
      type: object
      description: Sobre CloudEvents 1.0 (modo estructurado JSON) con extensiones de Bandada U.
      required:
      - specversion
      - id
      - source
      - type
      - time
      - datacontenttype
      - correlationid
      - data
      properties:
        specversion:
          type: string
          const: '1.0'
        id:
          type: string
          format: uuid
          description: UUIDv7 único del mensaje (clave del inbox).
        source:
          type: string
          pattern: ^/services/[a-z0-9-]+$
          examples:
          - /services/events-service
        type:
          type: string
          pattern: ^bandada\.[a-z]+\.[a-z0-9.-]+\.v[0-9]+$
          description: Igual a la routing key.
        time:
          type: string
          format: date-time
        subject:
          type: string
          description: Recurso afectado, p. ej. `registrations/<id>`.
        datacontenttype:
          type: string
          const: application/json
        dataschema:
          type: string
          format: uri
        correlationid:
          type: string
          description: Id de correlación de extremo a extremo (cabecera `X-Correlation-Id` de la petición original).
        causationid:
          type: string
          format: uuid
          description: '`id` del mensaje que causó este (ausente si lo originó una petición HTTP o un cron).'
        sagaid:
          type: string
          format: uuid
          description: Id de la `SagaInstance` (obligatorio en comandos y respuestas de la SAGA).
        traceparent:
          type: string
          pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
          description: W3C Trace Context (OpenTelemetry).
        data:
          type: object
    Role:
      type: string
      enum:
      - STUDENT
      - ORGANIZER
      - MODERATOR
      - ADMIN
    UserStatus:
      type: string
      enum:
      - PENDING_VERIFICATION
      - ACTIVE
      - SUSPENDED
      - DELETED
    PostVisibility:
      type: string
      enum:
      - PUBLIC
      - FOLLOWERS
      - GROUP
    PostStatus:
      type: string
      enum:
      - PENDING_MEDIA
      - PUBLISHED
      - HIDDEN
      - REMOVED
    ReactionType:
      type: string
      enum:
      - LIKE
      - HELPFUL
      - FUNNY
      - SUPPORT
    GroupPrivacy:
      type: string
      enum:
      - PUBLIC
      - PRIVATE
    MembershipStatus:
      type: string
      enum:
      - PENDING
      - ACTIVE
      - REJECTED
      - LEFT
    MediaKind:
      type: string
      enum:
      - IMAGE
      - VIDEO
    ModerationDecision:
      type: string
      enum:
      - ALLOW
      - REVIEW
      - BLOCK
    EventStatus:
      type: string
      enum:
      - DRAFT
      - PUBLISHED
      - CANCELLED
      - FINISHED
    TopUpPackage:
      type: string
      enum:
      - CREDITS_20
      - CREDITS_50
      - CREDITS_100
      description: Paquete de recarga; igual que `TopUpPackage` de `wallet-service.yaml`.
    AlertSeverity:
      type: string
      enum:
      - INFO
      - WARNING
      - CRITICAL
    Locale:
      type: string
      enum:
      - es
      - en
      description: Idioma (D14). Debe coincidir con `Locale` de `bandadau-docs/contracts/openapi/shared/components.yaml`.
    ThemePreference:
      type: string
      enum:
      - SYSTEM
      - LIGHT
      - DARK
      description: Preferencia de tema (D13). Debe coincidir con `ThemePreference` de `bandadau-docs/contracts/openapi/shared/components.yaml`.
    ContentReportTargetType:
      type: string
      description: Valores de `ContentReport.targetType` (`ReportTargetType`, RF-13, ADR-0016).
      enum:
      - POST
      - COMMENT
    ReportReason:
      type: string
      description: Motivo de una denuncia (`ReportReason`, ADR-0016); igual que en `social-service.yaml`.
      enum:
      - SPAM
      - HARASSMENT
      - NSFW
      - VIOLENCE
      - MISINFORMATION
      - OTHER
    HiddenReason:
      type: string
      description: Motivo por el que un contenido está oculto (`HiddenReason`, ADR-0016); igual que en `social-service.yaml`.
      enum:
      - MEDIA_FLAGGED
      - REPORTED
      - MODERATOR
    CommentStatus:
      type: string
      description: Estado de un comentario (`CommentStatus`, ADR-0016).
      enum:
      - VISIBLE
      - HIDDEN
      - REMOVED
    RegistrationFailureReason:
      type: string
      description: Valores de `Registration.failureReason` (`RegistrationFailureReason`, ADR-0016); igual que en `events-service.yaml`.
      enum:
      - EVENT_FULL
      - INSUFFICIENT_FUNDS
      - WALLET_NOT_FOUND
      - TICKET_ISSUE_FAILED
      - TIMEOUT
      - SAGA_ABORTED
    AlertKind:
      type: string
      description: Valores de `Alert.kind` (`AlertKind`, RF-24, D10, ADR-0016); igual que en `insights-service.yaml`.
      enum:
      - SERVICE_DOWN
      - SAGA_FAILURES
      - DLQ_BACKLOG
      - MODERATION_BACKLOG
      - METRIC_ANOMALY
      - MODERATION_ESCALATION
    GeneratedReportStatus:
      type: string
      description: Valores de `GeneratedReport.status` (`GeneratedReportStatus`, ADR-0016); igual que en `insights-service.yaml`.
      enum:
      - PENDING
      - RUNNING
      - READY
      - FAILED
    UserRegisteredData:
      type: object
      required:
      - userId
      - email
      - universityId
      - displayName
      - roles
      - locale
      - occurredAt
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        universityId:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 80
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          minItems: 1
        locale:
          $ref: '#/components/schemas/Locale'
        occurredAt:
          type: string
          format: date-time
    UserRoleChangedData:
      type: object
      required:
      - userId
      - previousRoles
      - roles
      - changedBy
      - occurredAt
      properties:
        userId:
          type: string
          format: uuid
        previousRoles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          minItems: 1
        changedBy:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
    UserSuspendedData:
      type: object
      required:
      - userId
      - reason
      - suspendedBy
      - occurredAt
      properties:
        userId:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 500
        suspendedBy:
          type: string
          format: uuid
        until:
          type:
          - string
          - 'null'
          format: date-time
        occurredAt:
          type: string
          format: date-time
    UserReactivatedData:
      type: object
      required:
      - userId
      - reactivatedBy
      - occurredAt
      properties:
        userId:
          type: string
          format: uuid
        reactivatedBy:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
    UserPreferencesChangedData:
      type: object
      required:
      - userId
      - locale
      - theme
      - occurredAt
      properties:
        userId:
          type: string
          format: uuid
        locale:
          $ref: '#/components/schemas/Locale'
        theme:
          $ref: '#/components/schemas/ThemePreference'
        occurredAt:
          type: string
          format: date-time
    PostCreatedData:
      type: object
      required:
      - postId
      - authorId
      - clientId
      - groupId
      - visibility
      - status
      - hashtags
      - mediaIds
      - occurredAt
      properties:
        postId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
        groupId:
          type:
          - string
          - 'null'
          format: uuid
        visibility:
          $ref: '#/components/schemas/PostVisibility'
        status:
          $ref: '#/components/schemas/PostStatus'
        hashtags:
          type: array
          items:
            type: string
        mediaIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 4
        occurredAt:
          type: string
          format: date-time
    PostPublishedData:
      type: object
      required:
      - postId
      - authorId
      - groupId
      - visibility
      - hashtags
      - mediaIds
      - occurredAt
      properties:
        postId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        groupId:
          type:
          - string
          - 'null'
          format: uuid
        visibility:
          $ref: '#/components/schemas/PostVisibility'
        hashtags:
          type: array
          items:
            type: string
        mediaIds:
          type: array
          items:
            type: string
            format: uuid
        occurredAt:
          type: string
          format: date-time
    PostHiddenData:
      type: object
      required:
      - postId
      - authorId
      - reason
      - occurredAt
      properties:
        postId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        reason:
          description: |-
            `HiddenReason` (ADR-0016) más `AUTHOR_SUSPENDED` (confirmado en la fase 1: contenido ocultado en bloque al suspender al autor y restaurado con `user.reactivated.v1`).
          type: string
          enum:
          - MEDIA_FLAGGED
          - REPORTED
          - MODERATOR
          - AUTHOR_SUSPENDED
        occurredAt:
          type: string
          format: date-time
    PostDeletedData:
      type: object
      required:
      - postId
      - authorId
      - mediaIds
      - deletedBy
      - reason
      - occurredAt
      properties:
        postId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        mediaIds:
          type: array
          items:
            type: string
            format: uuid
        deletedBy:
          type: string
          format: uuid
        reason:
          type: string
          enum:
          - AUTHOR
          - MODERATOR
        occurredAt:
          type: string
          format: date-time
    CommentCreatedData:
      type: object
      required:
      - commentId
      - postId
      - postAuthorId
      - authorId
      - occurredAt
      properties:
        commentId:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        postAuthorId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
    CommentHiddenData:
      type: object
      required:
      - commentId
      - postId
      - authorId
      - status
      - reason
      - openReportsCount
      - occurredAt
      properties:
        commentId:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        status:
          description: Nuevo estado del comentario (`HIDDEN` por umbral de denuncias, `REMOVED` por decisión de moderación).
          type: string
          enum:
          - HIDDEN
          - REMOVED
        reason:
          type: string
          enum:
          - REPORTED
          - MODERATOR
        openReportsCount:
          type: integer
          minimum: 0
        occurredAt:
          type: string
          format: date-time
    PostRemovedData:
      type: object
      required:
      - postId
      - authorId
      - mediaIds
      - removedBy
      - reportId
      - note
      - occurredAt
      properties:
        postId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        mediaIds:
          type: array
          items:
            type: string
            format: uuid
        removedBy:
          type: string
          format: uuid
          description: Moderador o ADMIN que tomó la decisión (`X-Actor-Id`).
        reportId:
          type:
          - string
          - 'null'
          format: uuid
          description: Denuncia que originó la decisión (`null` si fue `updatePostStatus` directo).
        note:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Motivo comunicado al autor (sin datos del denunciante).
        occurredAt:
          type: string
          format: date-time
    ReactionSetData:
      type: object
      required:
      - postId
      - postAuthorId
      - userId
      - type
      - previousType
      - occurredAt
      properties:
        postId:
          type: string
          format: uuid
        postAuthorId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ReactionType'
        previousType:
          oneOf:
          - $ref: '#/components/schemas/ReactionType'
          - type: 'null'
        occurredAt:
          type: string
          format: date-time
    FollowCreatedData:
      type: object
      required:
      - followerId
      - followeeId
      - occurredAt
      properties:
        followerId:
          type: string
          format: uuid
        followeeId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
    GroupJoinRequestedData:
      type: object
      required:
      - groupId
      - groupName
      - privacy
      - userId
      - membershipStatus
      - groupAdminIds
      - occurredAt
      properties:
        groupId:
          type: string
          format: uuid
        groupName:
          type: string
        privacy:
          $ref: '#/components/schemas/GroupPrivacy'
        userId:
          type: string
          format: uuid
        membershipStatus:
          $ref: '#/components/schemas/MembershipStatus'
        groupAdminIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        occurredAt:
          type: string
          format: date-time
    ContentReportedData:
      type: object
      required:
      - reportId
      - targetType
      - targetId
      - targetAuthorId
      - reporterId
      - reason
      - openReportsCount
      - autoHidden
      - occurredAt
      properties:
        reportId:
          type: string
          format: uuid
        targetType:
          $ref: '#/components/schemas/ContentReportTargetType'
        targetId:
          type: string
          format: uuid
        targetAuthorId:
          type: string
          format: uuid
        reporterId:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/ReportReason'
        details:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Explicación opcional del denunciante.
        openReportsCount:
          type: integer
          minimum: 1
        autoHidden:
          type: boolean
        occurredAt:
          type: string
          format: date-time
    MediaAssetApprovedData:
      type: object
      required:
      - mediaId
      - ownerId
      - kind
      - decision
      - tags
      - modelVersion
      - reviewedBy
      - occurredAt
      properties:
        mediaId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/MediaKind'
        decision:
          $ref: '#/components/schemas/ModerationDecision'
        tags:
          type: array
          items:
            type: string
        modelVersion:
          type: string
        reviewedBy:
          type:
          - string
          - 'null'
          format: uuid
        occurredAt:
          type: string
          format: date-time
    MediaAssetFlaggedData:
      type: object
      required:
      - mediaId
      - ownerId
      - kind
      - decision
      - labels
      - scores
      - maxScore
      - modelVersion
      - occurredAt
      properties:
        mediaId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/MediaKind'
        decision:
          $ref: '#/components/schemas/ModerationDecision'
        labels:
          type: array
          items:
            type: string
        scores:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
        maxScore:
          type: number
          minimum: 0
          maximum: 1
        modelVersion:
          type: string
        occurredAt:
          type: string
          format: date-time
    MediaAssetRejectedData:
      type: object
      required:
      - mediaId
      - ownerId
      - kind
      - decision
      - source
      - occurredAt
      properties:
        mediaId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/MediaKind'
        decision:
          $ref: '#/components/schemas/ModerationDecision'
        scores:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
        source:
          type: string
          enum:
          - AUTOMATIC
          - MODERATOR
        reviewedBy:
          type:
          - string
          - 'null'
          format: uuid
        note:
          type:
          - string
          - 'null'
        occurredAt:
          type: string
          format: date-time
    EventPublishedData:
