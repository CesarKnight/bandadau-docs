  consumeQAdminGatewaySubscriptionsQueue:
    action: receive
    title: admin-gateway consume admin-gateway.subscriptions.<instanceId>
    summary: Eventos que alimentan las subscriptions GraphQL del panel (una cola exclusiva por réplica).
    channel:
      $ref: '#/channels/qAdminGatewaySubscriptionsQueue'
    messages:
    - $ref: '#/channels/qAdminGatewaySubscriptionsQueue/messages/MediaAssetApprovedV1'
    - $ref: '#/channels/qAdminGatewaySubscriptionsQueue/messages/MediaAssetFlaggedV1'
    - $ref: '#/channels/qAdminGatewaySubscriptionsQueue/messages/MediaAssetRejectedV1'
    - $ref: '#/channels/qAdminGatewaySubscriptionsQueue/messages/SocialContentReportedV1'
    - $ref: '#/channels/qAdminGatewaySubscriptionsQueue/messages/SocialPostHiddenV1'
    - $ref: '#/channels/qAdminGatewaySubscriptionsQueue/messages/InsightsAlertRaisedV1'
    - $ref: '#/channels/qAdminGatewaySubscriptionsQueue/messages/InsightsReportReadyV1'
