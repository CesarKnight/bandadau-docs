    IdentityUserRegisteredV1:
      name: IdentityUserRegisteredV1
      title: Usuario registrado y verificado
      summary: bandada.identity.user.registered.v1
      description: |-
        Se emite cuando la cuenta pasa a `ACTIVE` tras verificar el correo institucional (UC-01). social-service crea el `Profile`, notification-service guarda el idioma y envía bienvenida in-app, n8n `wf-01-bienvenida`.

        **Exchange:** `bandada.events` · **Publica:** `identity-service`
      contentType: application/cloudevents+json
      correlationId:
        location: $message.payload#/correlationid
      tags:
      - name: identity-service
      payload:
        allOf:
        - $ref: '#/components/schemas/CloudEventEnvelope'
        - type: object
          properties:
            type:
              const: bandada.identity.user.registered.v1
            source:
              const: /services/identity-service
            data:
              $ref: '#/components/schemas/UserRegisteredData'
      bindings:
        amqp:
          messageType: bandada.identity.user.registered.v1
          bindingVersion: 0.3.0
      examples:
      - name: ejemplo
        summary: Usuario registrado y verificado
        payload:
          specversion: '1.0'
          id: 0192a3bf-dddd-7eee-8fff-845575754603
          source: /services/identity-service
          type: bandada.identity.user.registered.v1
          time: '2026-10-14T14:00:00Z'
          subject: users/0192a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
          datacontenttype: application/json
          correlationid: 0192a3bf-cccc-7ddd-8eee-000000000999
          traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
          data:
            userId: 0192a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
            email: valeria.quispe@umsa.bo
            universityId: 0192a3a1-0000-7000-8000-000000000001
