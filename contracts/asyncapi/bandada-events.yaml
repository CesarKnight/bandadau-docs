    - $ref: '#/channels/qInsightsServiceAnalyticsQueue/messages/TicketingTicketVoidedV1'
    - $ref: '#/channels/qInsightsServiceAnalyticsQueue/messages/TicketingTicketVoidFailedV1'
    - $ref: '#/channels/qInsightsServiceAnalyticsQueue/messages/TicketingTicketUsedV1'
    - $ref: '#/channels/qInsightsServiceAnalyticsQueue/messages/InsightsAlertRaisedV1'
    - $ref: '#/channels/qInsightsServiceAnalyticsQueue/messages/InsightsReportReadyV1'
