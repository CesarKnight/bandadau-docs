      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    post:
      tags: [reports]
      operationId: reportContent
      summary: Denunciar contenido
      description: |
        Denuncia un post o comentario con un motivo (UC-10, RF-13). Una denuncia por usuario y
        contenido. Con 3 denuncias de usuarios distintos el contenido pasa a `HIDDEN` hasta su
        revisión. Publica `bandada.social.content.reported.v1`.
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportContentRequest'
            examples:
              denuncia:
                summary: Denunciar un post
                value:
                  targetType: POST
                  targetId: 0192f2a0-5b6c-7d8e-9f01-a2b3c4d5e6f7
                  reason: HARASSMENT
                  details: Contiene datos personales de otro estudiante sin su permiso.
      responses:
        '201':
          description: Denuncia registrada.
          headers:
            Idempotent-Replayed:
              $ref: './shared/components.yaml#/components/headers/IdempotentReplayed'
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
            X-Correlation-Id:
              $ref: './shared/components.yaml#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentReport'
              examples:
                denuncia:
                  $ref: '#/components/examples/ReportOpen'
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './shared/components.yaml#/components/responses/NotFound'
        '409':
          description: Ya denunciaste este contenido (`ALREADY_REPORTED`) o hay una petición idéntica en curso (`IDEMPOTENCY_IN_PROGRESS`).
          content:
            application/problem+json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Problem'
              examples:
                yaDenunciado:
                  summary: Denuncia repetida
                  value:
                    type: https://api.bandadau.com/problems/already-reported
                    title: Ya denunciaste este contenido
                    status: 409
                    detail: Tu denuncia anterior está en revisión.
                    instance: /api/v1/reports
                    code: ALREADY_REPORTED
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '422':
          description: No puedes denunciar tu propio contenido (`CANNOT_REPORT_OWN_CONTENT`) o `IDEMPOTENCY_KEY_REUSED`.
          content:
            application/problem+json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Problem'
              examples:
                propio:
                  summary: Contenido propio
                  value:
                    type: https://api.bandadau.com/problems/cannot-report-own-content
                    title: Acción no permitida
                    status: 422
                    detail: No puedes denunciar tu propio contenido.
                    instance: /api/v1/reports
                    code: CANNOT_REPORT_OWN_CONTENT
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '429':
          $ref: './shared/components.yaml#/components/responses/TooManyRequests'

