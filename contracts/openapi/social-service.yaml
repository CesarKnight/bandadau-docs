openapi: 3.1.0
info:
  title: Bandada U — social-service
  version: 1.8.0
  summary: Red social (perfiles, posts, feed, comentarios, reacciones, seguidores, grupos y denuncias).
  description: |
    API del bounded context **Social** (`social-service`, TypeScript + NestJS 11, Clean
    Architecture, MongoDB `social`).

    - Posts con texto (≤ 2000), hasta 4 imágenes **o** 1 video, hashtags (extraídos del texto)
      y visibilidad `PUBLIC | FOLLOWERS | GROUP` (RF-06). Un post con medios queda
      `PENDING_MEDIA` hasta que todos sus medios estén `APPROVED` en `media-service` (invariante 6).
    - Publicación offline sin duplicados: `Idempotency-Key` + `clientId` UUIDv7 único por autor (D3, RF-08).
    - Feed paginado por cursor con ranking ML (`feed-ranker`, D7; RF-09).
    - 3 denuncias distintas ocultan el contenido automáticamente hasta revisión (RF-13).
    - El contenido de los usuarios (posts, comentarios) **no** se traduce (D14).
    - Errores RFC 9457 (`application/problem+json`); `title`/`detail` localizados según
      `Accept-Language` (`es` por defecto) y respuesta con `Content-Language`. Los clientes traducen por `code`.
    - Todas las respuestas devuelven `X-Correlation-Id`.
    - Rutas `/internal/v1/**` (tag `internal`): solo red interna con `serviceAuth`; consumidas por
      `admin-gateway` e `insights-service` (MCP `get_content_stats`, `list_flagged_content`).

    ## Decisiones de implementación (fase 1)
    - **404 de dominio**: `POST_NOT_FOUND`, `COMMENT_NOT_FOUND`, `PROFILE_NOT_FOUND` y `GROUP_NOT_FOUND` (recurso indicado en la ruta o, para denuncias, en el cuerpo);
      `NOT_FOUND` queda para recursos sin código propio (denuncia, solicitud de membresía). En `createPost` un `groupId` inexistente sigue siendo `422 GROUP_NOT_FOUND`.
    - **Scopes en `/internal/v1/**`**: el token de servicio debe llevar `internal:read` (GET) o `internal:write` (PATCH/POST/DELETE); sin el scope → `403 FORBIDDEN`.
    - **Avatar con revisión**: `updateMyProfile` con `avatarMediaId` de un medio aún `PENDING_UPLOAD`/`PROCESSING` responde `200` y conserva el avatar anterior;
      el medio queda como avatar *pendiente* (campo interno `pendingAvatarMediaId`, **no se expone** en `Profile`) y se promueve a `avatarMediaId`
      al llegar `bandada.media.asset.approved.v1` del mismo dueño (si ya estaba `APPROVED`, se promueve al instante). `FLAGGED`/`REJECTED` → `422` `MEDIA_NOT_APPROVED`.
      `Profile.avatarStatus` (`PENDING|APPROVED|REJECTED`, `null` sin avatar) expone ese estado: `PENDING` mientras el medio se revisa, `APPROVED` con el avatar vigente,
      `REJECTED` si el último medio enviado fue `FLAGGED`/`REJECTED` (se conserva el avatar anterior, si lo había).
    - **Suspensión del autor**: al suspenderse un usuario (`bandada.identity.user.suspended.v1`) sus posts y comentarios pasan a `HIDDEN` con
      `hiddenReason = AUTHOR_SUSPENDED`; al reactivarse se restauran. En `/internal/v1` el motivo se presenta tal cual (`AUTHOR_SUSPENDED`), sin disfrazarlo de `MODERATOR`.
    - Un `post.removed` (moderador) conserva el contenido; `post.deleted` solo ocurre por borrado del autor.

    ## Changelog
    - 1.8.0 (2026-10-16): nuevos `GET /internal/v1/stats/careers` (`getCareerStats`) y `GET /internal/v1/stats/rankings` (`getContentRankings`) para las herramientas MCP `get_user_stats` y `get_content_rankings`. Scope `internal:read`.
    - 1.7.0 (2026-10-16): nuevo `GET /internal/v1/profiles` (`getProfileNamesInternal`): resuelve en lote (≤ 50 ids) el `displayName` de varios usuarios para los reportes del panel (MCP `list_recent_registrations`, `get_top_credit_spenders`); solo `userId` y `displayName`, nunca correo ni teléfono. Scope `internal:read`.
    - 1.6.0 (2026-10-15): nuevo `GET /profiles/{userId}/posts` (`listUserPosts`): posts de un estudiante para la grilla del perfil (UC-04); faltaba en el contrato y la app lo consumía.
    - 1.5.0 (2026-10-15): nuevo `GET /internal/v1/comments/{commentId}` (`getCommentInternal`, R-1): comentario en cualquier estado para el detalle de denuncias de comentario; `404 COMMENT_NOT_FOUND`.
    - 1.4.0 (2026-10-15): `Profile.avatarStatus` (D-9); códigos 404 de dominio `POST_NOT_FOUND`/`COMMENT_NOT_FOUND`/`PROFILE_NOT_FOUND`/`GROUP_NOT_FOUND` (D-17);
      `ModerationPost.hiddenReason` conserva `AUTHOR_SUSPENDED`; nuevo `GET /internal/v1/posts/{postId}` (`getPostInternal`, D-6); scopes `internal:read|write` exigidos (D-7).
    - 1.3.0 (2026-10-15): consolidación fase 1 — `HiddenReason` agrega `AUTHOR_SUSPENDED` (deja de ser propuesta); documentado el flujo de avatar pendiente
      (`pendingAvatarMediaId` interno), el uso de `NOT_FOUND` genérico y la suspensión de autor.
    - 1.2.0 (2026-10-14): respuestas a comentarios (UC-07): `Comment.parentId` y `Comment.replyCount`
      (un nivel de anidación); `CreateCommentRequest.parentId` para responder a un comentario raíz.
    - 1.1.0 (2026-10-14): ADR-0016/D15 — `rejectGroupMember`, `leaveGroup`, `getProfileInternal`,
      `listGroupsInternal`; enums `ReportReason`, `ReportResolution`, `CommentStatus`, `HiddenReason`
      y `GroupMemberRole` (`OWNER`, `ADMIN`, `MEMBER`); `Comment.status`; denuncias con `reason`
      enumerado + `details`; `resolveContentReport` recibe `resolution: KEEP|REMOVE`;
      `listGroupMembers` y `resolveContentReport` dejan de ser propuestas.
    - 1.0.0 (2026-10-14): versión inicial contract-first (D1, D3, D7, D14).
  contact:
    name: Grupo 24 — Ingeniería de Software II
servers:
  - url: http://api.bandada.localhost/api/v1
    description: Desarrollo local (Traefik)
  - url: https://api.bandadau.com/api/v1
    description: Producción
tags:
  - name: profiles
    description: Perfil académico de los estudiantes.
  - name: posts
    description: Publicaciones, comentarios y reacciones.
  - name: feed
    description: Feed personalizado.
  - name: follows
    description: Seguidores y sugerencias.
  - name: groups
    description: Grupos de estudio.
  - name: reports
    description: Denuncias de contenido.
  - name: internal
    description: Endpoints internos (`/internal/v1`), solo con token de servicio.
security:
  - bearerAuth: []
paths:
  /profiles/me:
    parameters:
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    get:
      tags: [profiles]
      operationId: getMyProfile
      summary: Obtener mi perfil
      description: |
        Devuelve el perfil académico del usuario autenticado (UC-04). El perfil se crea
        automáticamente al consumir `bandada.identity.user.registered.v1`.
      responses:
        '200':
          description: Mi perfil.
          headers:
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
              examples:
                ana:
                  $ref: '#/components/examples/ProfileAna'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './shared/components.yaml#/components/responses/NotFound'
    patch:
      tags: [profiles]
      operationId: updateMyProfile
      summary: Editar mi perfil
      description: |
        Actualiza los campos presentes del perfil (UC-04, RF-05): nombre visible, avatar,
        carrera, semestre, bio (≤ 280) e intereses (≤ 10). La universidad es de solo lectura.
        `avatarMediaId` debe ser un medio `IMAGE` propio: si está `APPROVED` se aplica al instante; si aún se procesa queda pendiente y el avatar anterior se conserva hasta su aprobación; `FLAGGED`/`REJECTED` → `422` `MEDIA_NOT_APPROVED`; `null` lo quita.
        Idempotente por naturaleza.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            examples:
              editar:
                summary: Actualizar bio e intereses
                value:
                  displayName: Ana Quispe
                  career: Ingeniería de Sistemas
                  semester: 6
                  bio: Me gusta el desarrollo móvil y los hackatones. 🐦
                  interests: [react-native, ia, hackatones]
      responses:
        '200':
          description: Perfil actualizado.
          headers:
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
              examples:
                ana:
                  $ref: '#/components/examples/ProfileAna'
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '422':
          description: Avatar inválido (`MEDIA_NOT_FOUND`, `MEDIA_NOT_OWNED`, `MEDIA_NOT_APPROVED`, `INVALID_MEDIA_KIND`).
          content:
            application/problem+json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Problem'
              examples:
                avatarNoAprobado:
                  summary: Avatar aún en moderación
                  value:
                    type: https://api.bandadau.com/problems/media-not-approved
                    title: Imagen no disponible
                    status: 422
                    detail: La imagen del avatar todavía está en revisión.
                    instance: /api/v1/profiles/me
                    code: MEDIA_NOT_APPROVED
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736

  /profiles/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    get:
      tags: [profiles]
      operationId: getProfile
      summary: Ver el perfil de un estudiante
      description: Perfil público de otro usuario, con contadores y si lo sigo (`followedByMe`).
      responses:
        '200':
          description: Perfil.
          headers:
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
              examples:
                luis:
                  summary: Perfil de otro estudiante
                  value:
                    userId: 0192f1a2-4c5d-7e6f-9a01-8293a4b5c6d7
                    displayName: Luis Mamani
                    universityId: 0191c0de-1111-7aaa-8bbb-000000000001
                    career: Ingeniería de Sistemas
                    semester: 4
                    bio: Fan del fútbol y de las bases de datos.
                    interests: [postgres, futbol]
                    avatarMediaId: null
                    avatarStatus: null
                    avatarUrl: null
                    followersCount: 87
                    followingCount: 120
                    postsCount: 15
                    followedByMe: true
                    createdAt: '2026-09-20T10:00:00Z'
                    updatedAt: '2026-10-02T18:30:00Z'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './shared/components.yaml#/components/responses/NotFound'

  /profiles/{userId}/posts:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    get:
      tags: [posts]
      operationId: listUserPosts
      summary: Listar los posts de un estudiante
      description: |
        Posts visibles del usuario indicado, del más reciente al más antiguo (grilla del perfil, UC-04).
        Paginado por cursor; solo se incluyen posts visibles para quien consulta.
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/Cursor'
        - $ref: './shared/components.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Página de posts del usuario.
          headers:
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPage'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './shared/components.yaml#/components/responses/NotFound'

  /posts:
    parameters:
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    post:
      tags: [posts]
      operationId: createPost
      summary: Publicar un post
      description: |
        Crea un post (UC-05, RF-06, RF-08). Reglas:
        - `text` ≤ 2000 caracteres; se requiere texto o al menos un medio (`EMPTY_POST`).
        - `mediaIds`: hasta 4 imágenes **o** 1 video, todos propios y subidos con `media-service`.
        - `visibility = GROUP` exige `groupId` y ser miembro `ACTIVE` del grupo.
        - Hashtags extraídos del texto (`#calculo` → `calculo`).
        - Sin medios → `PUBLISHED`; con medios → `PENDING_MEDIA` hasta que todos estén
          `APPROVED` (se publica al consumir `bandada.media.asset.approved.v1`).
        - `clientId` (UUIDv7 generado en el dispositivo) es único por autor: si ya existe un
          post con ese `clientId`, se responde **200** con el post existente (cola offline que
          reintenta después de expirar la `Idempotency-Key`).
        Publica `bandada.social.post.created.v1` (y `post.published.v1` cuando corresponde).
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
            examples:
              conImagen:
                summary: Post público con una imagen
                value:
                  clientId: 0192f2a0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                  text: Comparto mis apuntes de #calculo2 del parcial 🙌
                  mediaIds: [0192f29f-0e1f-7a2b-bc3d-4e5f6a7b8c9d]
                  visibility: PUBLIC
              enGrupo:
                summary: Post de solo texto en un grupo
                value:
                  clientId: 0192f2a0-2b3c-7d4e-9f50-6a7b8c9d0e1f
                  text: ¿Alguien resolvió el ejercicio 4 de la práctica de #fisica1?
                  mediaIds: []
                  visibility: GROUP
                  groupId: 0192e0aa-bc12-7d34-8e56-f7a8b9c0d1e2
      responses:
        '201':
          description: Post creado.
          headers:
            Location:
              $ref: './shared/components.yaml#/components/headers/Location'
            Idempotent-Replayed:
              $ref: './shared/components.yaml#/components/headers/IdempotentReplayed'
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
            X-Correlation-Id:
              $ref: './shared/components.yaml#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
              examples:
                pendiente:
                  $ref: '#/components/examples/PostPendingMedia'
        '200':
          description: Ya existía un post del autor con el mismo `clientId`; se devuelve sin duplicar.
          headers:
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
              examples:
                existente:
                  $ref: '#/components/examples/PostPublished'
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GroupMembershipRequired'
        '409':
          $ref: './shared/components.yaml#/components/responses/Conflict'
        '422':
          description: |
            Regla de negocio violada: `EMPTY_POST`, `INVALID_MEDIA_COMBINATION` (más de 4
            imágenes o video + imágenes), `MEDIA_NOT_FOUND`, `MEDIA_NOT_OWNED`, `MEDIA_REJECTED`,
            `GROUP_REQUIRED`, `GROUP_NOT_FOUND` o `IDEMPOTENCY_KEY_REUSED`.
          content:
            application/problem+json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Problem'
              examples:
                combinacion:
                  summary: Video con imágenes
                  value:
                    type: https://api.bandadau.com/problems/invalid-media-combination
                    title: Combinación de medios no permitida
                    status: 422
                    detail: Un post puede tener hasta 4 imágenes o 1 video, no ambos.
                    instance: /api/v1/posts
                    code: INVALID_MEDIA_COMBINATION
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                claveReutilizada:
                  summary: Idempotency-Key reutilizada
                  value:
                    type: https://api.bandadau.com/problems/idempotency-key-reused
                    title: Clave de idempotencia reutilizada
                    status: 422
                    detail: La Idempotency-Key ya se usó con una petición diferente.
                    instance: /api/v1/posts
                    code: IDEMPOTENCY_KEY_REUSED
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '429':
          $ref: './shared/components.yaml#/components/responses/TooManyRequests'

  /posts/{postId}:
    parameters:
      - $ref: '#/components/parameters/PostId'
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    get:
      tags: [posts]
      operationId: getPost
      summary: Ver un post
      description: Devuelve el post si es visible para el usuario (autor, visibilidad, pertenencia al grupo). Si no es visible responde `404`.
      responses:
        '200':
          description: Post.
          headers:
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
              examples:
                publicado:
                  $ref: '#/components/examples/PostPublished'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './shared/components.yaml#/components/responses/NotFound'
    delete:
      tags: [posts]
      operationId: deletePost
      summary: Eliminar mi post
      description: |
        El autor elimina su post (borrado lógico → `REMOVED`). Publica
        `bandada.social.post.deleted.v1` (media-service borra los medios asociados).
        Idempotente: eliminar un post ya eliminado responde `204`.
      responses:
        '204':
          description: Post eliminado.
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/components.yaml#/components/responses/NotFound'

  /feed:
    parameters:
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    get:
      tags: [feed]
      operationId: getFeed
      summary: Ver mi feed
      description: |
        Feed paginado por cursor que combina posts de personas seguidas, de mis grupos y
        recomendados por el modelo `feed-ranker` (UC-06, RF-09). Solo posts `PUBLISHED`.
        El cliente lo cachea para lectura offline (D6, `NetworkFirst`).
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/Cursor'
        - $ref: './shared/components.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Página del feed.
          headers:
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPage'
              examples:
                pagina:
                  summary: Primera página
                  value:
                    items:
                      - source: FOLLOWING
                        score: 0.87
                        post:
                          id: 0192f2a0-5b6c-7d8e-9f01-a2b3c4d5e6f7
                          clientId: 0192f2a0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                          authorId: 0192f1a2-3b4c-7d5e-8f60-718293a4b5c6
                          author:
                            userId: 0192f1a2-3b4c-7d5e-8f60-718293a4b5c6
                            displayName: Ana Quispe
                            avatarUrl: null
                          text: Comparto mis apuntes de #calculo2 del parcial 🙌
                          hashtags: [calculo2]
                          visibility: PUBLIC
                          groupId: null
                          status: PUBLISHED
                          media: []
                          reactionCounts: {like: 12, helpful: 30, funny: 0, support: 2}
                          commentsCount: 5
                          myReaction: HELPFUL
                          createdAt: '2026-10-14T13:00:00Z'
                          updatedAt: '2026-10-14T13:00:05Z'
                    nextCursor: eyJzIjowLjg3LCJpZCI6IjAxOTJmMmEwIn0
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'

  /posts/{postId}/comments:
    parameters:
      - $ref: '#/components/parameters/PostId'
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    post:
      tags: [posts]
      operationId: createComment
      summary: Comentar un post
      description: |
        Agrega un comentario (≤ 500 caracteres) a un post visible y `PUBLISHED` (UC-07, RF-10).
        Publica `bandada.social.comment.created.v1` (notifica al autor).
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
            examples:
              comentario:
                summary: Comentario
                value:
                  text: ¡Gracias! Me salvaste para el examen del viernes.
      responses:
        '201':
          description: Comentario creado.
          headers:
            Idempotent-Replayed:
              $ref: './shared/components.yaml#/components/headers/IdempotentReplayed'
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
            X-Correlation-Id:
              $ref: './shared/components.yaml#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
              examples:
                comentario:
                  $ref: '#/components/examples/CommentLuis'
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './shared/components.yaml#/components/responses/NotFound'
        '409':
          $ref: './shared/components.yaml#/components/responses/Conflict'
        '422':
          description: El post no admite comentarios (`POST_NOT_PUBLISHED`) o `IDEMPOTENCY_KEY_REUSED`.
          content:
            application/problem+json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Problem'
              examples:
                noPublicado:
                  summary: Post no publicado
                  value:
                    type: https://api.bandadau.com/problems/post-not-published
                    title: Post no disponible
                    status: 422
                    detail: No se puede comentar un post que está oculto o en revisión.
                    instance: /api/v1/posts/0192f2a0-5b6c-7d8e-9f01-a2b3c4d5e6f7/comments
                    code: POST_NOT_PUBLISHED
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '429':
          $ref: './shared/components.yaml#/components/responses/TooManyRequests'
    get:
      tags: [posts]
      operationId: listComments
      summary: Listar comentarios de un post
      description: Comentarios `VISIBLE` del post, del más antiguo al más reciente, paginados por cursor. Los comentarios `HIDDEN` solo los ve su autor; los `REMOVED` no se devuelven.
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/Cursor'
