      description: |
        Resuelve una denuncia desde el panel (UC-18, D15; mutación GraphQL `resolveContentReport`).
        `resolution = REMOVE` deja la denuncia `RESOLVED_REMOVED` y pasa el contenido a `REMOVED`
        (publica `bandada.social.post.removed.v1` o `bandada.social.comment.hidden.v1` según el
        tipo); `resolution = KEEP` la deja `RESOLVED_KEPT` y restaura el contenido (`PUBLISHED` /
        `VISIBLE`) si estaba oculto por denuncias. Resuelve todas las denuncias abiertas del mismo
        contenido. Idempotente.
      servers:
        - url: http://social-service:7002
