                    targetType: POST
                    targetId: 0192f2a0-5b6c-7d8e-9f01-a2b3c4d5e6f7
                    reporterId: 0192f1a2-4c5d-7e6f-9a01-8293a4b5c6d7
                    reason: HARASSMENT
                    details: Contiene datos personales de otro estudiante sin su permiso.
                    status: RESOLVED_KEPT
                    resolution: KEEP
                    resolutionNote: No infringe las normas de la comunidad.
                    createdAt: '2026-10-14T14:00:00Z'
