  schemas:
    PostVisibility:
      type: string
      enum: [PUBLIC, FOLLOWERS, GROUP]
    PostStatus:
      type: string
      enum: [PENDING_MEDIA, PUBLISHED, HIDDEN, REMOVED]
    ReactionType:
      type: string
      enum: [LIKE, HELPFUL, FUNNY, SUPPORT]
    GroupPrivacy:
      type: string
      enum: [PUBLIC, PRIVATE]
    MembershipStatus:
      type: string
      enum: [PENDING, ACTIVE, REJECTED, LEFT]
    GroupMemberRole:
      type: string
      enum: [OWNER, ADMIN, MEMBER]
      description: Rol dentro del grupo (`GroupMemberRole`, ADR-0016). `ADMIN` puede aprobar o rechazar solicitudes.
    ReportStatus:
      type: string
      enum: [OPEN, RESOLVED_KEPT, RESOLVED_REMOVED]
    ReportTargetType:
      type: string
      enum: [POST, COMMENT]
      description: Tipo de contenido denunciado (RF-13).
    ReportReason:
      type: string
      enum: [SPAM, HARASSMENT, NSFW, VIOLENCE, MISINFORMATION, OTHER]
      description: Motivo de la denuncia (`ReportReason`, ADR-0016).
    ReportResolution:
      type: string
      enum: [KEEP, REMOVE]
      description: Decisión del moderador sobre una denuncia (`ReportResolution`, ADR-0016).
    CommentStatus:
      type: string
      enum: [VISIBLE, HIDDEN, REMOVED]
      description: Estado de un comentario (`CommentStatus`, ADR-0016). Con 3 denuncias pasa a `HIDDEN` (RF-13).
    HiddenReason:
      type: string
      enum: [MEDIA_FLAGGED, REPORTED, MODERATOR, AUTHOR_SUSPENDED]
      description: 'Motivo por el que un post está oculto (`HiddenReason`, ADR-0016). `AUTHOR_SUSPENDED`: el autor fue suspendido (se restaura al reactivarlo).'
    MediaKind:
      type: string
      enum: [IMAGE, VIDEO]
    MediaStatus:
      type: string
      enum: [PENDING_UPLOAD, PROCESSING, APPROVED, FLAGGED, REJECTED]

    ProfileSummary:
      type: object
      required: [userId, displayName, avatarUrl]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        avatarUrl:
          type: [string, 'null']
          format: uri
          description: URL prefirmada (15 min) de la miniatura del avatar.

    Profile:
      type: object
      required: [userId, displayName, universityId, career, semester, bio, interests, avatarMediaId, avatarStatus, avatarUrl, followersCount, followingCount, postsCount, followedByMe, createdAt, updatedAt]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 2
          maxLength: 50
        universityId:
          type: string
          format: uuid
          readOnly: true
          description: Universidad (solo lectura, viene de identity).
        career:
          type: [string, 'null']
          maxLength: 100
        semester:
          type: [integer, 'null']
          minimum: 1
          maximum: 14
        bio:
          type: [string, 'null']
          maxLength: 280
        interests:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 2
            maxLength: 30
        avatarMediaId:
          type: [string, 'null']
          format: uuid
        avatarStatus:
          description: |
            Estado de revisión del avatar: `PENDING` (en revisión; `avatarMediaId` conserva el anterior), `APPROVED` (vigente),
            `REJECTED` (el último medio enviado fue rechazado). `null` si no hay avatar ni envío.
          oneOf:
            - type: string
              enum: [PENDING, APPROVED, REJECTED]
            - type: 'null'
        avatarUrl:
          type: [string, 'null']
          format: uri
        followersCount:
          type: integer
          format: int64
        followingCount:
          type: integer
          format: int64
        postsCount:
          type: integer
          format: int64
        followedByMe:
          type: boolean
          description: Si el usuario autenticado sigue a este perfil (`false` en el propio).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UpdateProfileRequest:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 50
        career:
          type: [string, 'null']
          maxLength: 100
        semester:
          type: [integer, 'null']
          minimum: 1
          maximum: 14
        bio:
          type: [string, 'null']
          maxLength: 280
        interests:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 2
            maxLength: 30
        avatarMediaId:
          type: [string, 'null']
          format: uuid

    PostMedia:
      type: object
      description: Proyección local del estado de un medio de `media-service`.
      required: [mediaId, kind, status, url, thumbnailUrl]
      properties:
        mediaId:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/MediaKind'
        status:
          $ref: '#/components/schemas/MediaStatus'
        url:
          type: [string, 'null']
          format: uri
          description: URL prefirmada (15 min); `null` mientras no esté `APPROVED`.
        thumbnailUrl:
          type: [string, 'null']
          format: uri

    ReactionCounts:
      type: object
      required: [like, helpful, funny, support]
      description: Conteo por tipo de reacción (cada clave es el valor de `ReactionType` en camelCase).
      properties:
        like:
          type: integer
          format: int64
        helpful:
          type: integer
          format: int64
        funny:
          type: integer
          format: int64
        support:
          type: integer
          format: int64

    Post:
      type: object
      required: [id, clientId, authorId, author, text, hashtags, visibility, groupId, status, media, reactionCounts, commentsCount, myReaction, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
          format: uuid
          description: UUIDv7 generado en el dispositivo; único por autor.
        authorId:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/ProfileSummary'
        text:
          type: string
          maxLength: 2000
        hashtags:
          type: array
          items:
            type: string
          description: Hashtags extraídos del texto, sin `#` y en minúsculas.
        visibility:
          $ref: '#/components/schemas/PostVisibility'
        groupId:
          type: [string, 'null']
          format: uuid
        status:
          $ref: '#/components/schemas/PostStatus'
        media:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/PostMedia'
        reactionCounts:
          $ref: '#/components/schemas/ReactionCounts'
        commentsCount:
          type: integer
          format: int64
        myReaction:
          oneOf:
            - $ref: '#/components/schemas/ReactionType'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PostPage:
      allOf:
        - $ref: './shared/components.yaml#/components/schemas/CursorPageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Post'

    ModerationPost:
      allOf:
        - $ref: '#/components/schemas/Post'
        - type: object
          required: [reportsCount, hiddenReason]
          properties:
            reportsCount:
              type: integer
              format: int64
            hiddenReason:
              description: Motivo por el que el post está oculto (`null` si no lo está).
              oneOf:
                - $ref: '#/components/schemas/HiddenReason'
                - type: 'null'

    ModerationPostPage:
      allOf:
        - $ref: './shared/components.yaml#/components/schemas/CursorPageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ModerationPost'

    CreatePostRequest:
      type: object
      required: [clientId, text, mediaIds, visibility]
      properties:
        clientId:
          type: string
          format: uuid
          description: UUIDv7 generado en el dispositivo (cola offline).
        text:
          type: string
          maxLength: 2000
        mediaIds:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            format: uuid
        visibility:
          $ref: '#/components/schemas/PostVisibility'
        groupId:
          type: string
          format: uuid
          description: Obligatorio si `visibility = GROUP`.

    FeedItem:
      type: object
      required: [post, source, score]
      properties:
        post:
          $ref: '#/components/schemas/Post'
        source:
          type: string
          enum: [FOLLOWING, GROUP, RECOMMENDED, OWN]
          description: Por qué aparece el post en el feed.
        score:
          type: number
          minimum: 0
          maximum: 1
          description: Puntaje del `feed-ranker`.

    FeedPage:
      allOf:
        - $ref: './shared/components.yaml#/components/schemas/CursorPageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/FeedItem'

    Comment:
      type: object
      required: [id, postId, authorId, author, text, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/ProfileSummary'
        text:
          type: string
          minLength: 1
          maxLength: 500
        status:
          $ref: '#/components/schemas/CommentStatus'
        createdAt:
          type: string
          format: date-time
        parentId:
          type: string
          format: uuid
          description: Comentario raíz al que responde este comentario (un solo nivel de anidación). Ausente en comentarios raíz.
        replyCount:
          type: integer
          format: int64
          minimum: 0
          description: Cantidad de respuestas directas (solo relevante en comentarios raíz).

    CommentPage:
      allOf:
        - $ref: './shared/components.yaml#/components/schemas/CursorPageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Comment'

    CreateCommentRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
        parentId:
          type: string
          format: uuid
          description: Si se envía, el comentario es una respuesta a ese comentario raíz (UC-07).

    SetReactionRequest:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/ReactionType'

    ReactionState:
      type: object
      required: [postId, myReaction, reactionCounts]
      properties:
        postId:
          type: string
          format: uuid
        myReaction:
          oneOf:
            - $ref: '#/components/schemas/ReactionType'
            - type: 'null'
        reactionCounts:
          $ref: '#/components/schemas/ReactionCounts'

    Follow:
      type: object
      required: [followerId, followeeId, createdAt]
      properties:
        followerId:
          type: string
          format: uuid
        followeeId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    FollowSuggestion:
      type: object
      required: [profile, career, score, reasons, mutualFollowsCount]
      properties:
        profile:
          $ref: '#/components/schemas/ProfileSummary'
        career:
          type: [string, 'null']
        score:
          type: number
          minimum: 0
          maximum: 1
        reasons:
          type: array
          items:
            type: string
            enum: [SAME_CAREER, MUTUAL_FOLLOWS, SHARED_GROUPS, SHARED_INTERESTS]
        mutualFollowsCount:
          type: integer

    FollowSuggestionPage:
      allOf:
        - $ref: './shared/components.yaml#/components/schemas/CursorPageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/FollowSuggestion'

    Group:
      type: object
      required: [id, name, subject, privacy, ownerId, membersCount, myMembership, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 3
          maxLength: 80
        subject:
          type: string
          minLength: 2
          maxLength: 80
          description: Materia del grupo.
        privacy:
          $ref: '#/components/schemas/GroupPrivacy'
        ownerId:
          type: string
          format: uuid
        membersCount:
          type: integer
          format: int64
        myMembership:
          description: Mi membresía, o `null` si no pertenezco.
          oneOf:
            - type: object
              required: [role, status]
              properties:
                role:
                  $ref: '#/components/schemas/GroupMemberRole'
                status:
                  $ref: '#/components/schemas/MembershipStatus'
            - type: 'null'
        createdAt:
          type: string
          format: date-time

    GroupPage:
      allOf:
        - $ref: './shared/components.yaml#/components/schemas/CursorPageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Group'

    CreateGroupRequest:
      type: object
      required: [name, subject, privacy]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 80
        subject:
          type: string
          minLength: 2
          maxLength: 80
        privacy:
          $ref: '#/components/schemas/GroupPrivacy'

    GroupMembership:
      type: object
      required: [groupId, userId, role, status, requestedAt, updatedAt]
      properties:
        groupId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/GroupMemberRole'
        status:
          $ref: '#/components/schemas/MembershipStatus'
        profile:
          $ref: '#/components/schemas/ProfileSummary'
        requestedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    GroupMembershipPage:
      allOf:
        - $ref: './shared/components.yaml#/components/schemas/CursorPageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/GroupMembership'

    ReportContentRequest:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType:
          $ref: '#/components/schemas/ReportTargetType'
        targetId:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/ReportReason'
        details:
          type: string
          maxLength: 500
          description: Explicación opcional del denunciante (obligatoria en la práctica si `reason = OTHER`).

    ContentReport:
      type: object
      required: [id, targetType, targetId, reporterId, reason, details, status, resolution, resolutionNote, createdAt, resolvedAt]
      properties:
        id:
          type: string
          format: uuid
        targetType:
          $ref: '#/components/schemas/ReportTargetType'
        targetId:
          type: string
          format: uuid
        reporterId:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/ReportReason'
        details:
          type: [string, 'null']
          maxLength: 500
        status:
          $ref: '#/components/schemas/ReportStatus'
        resolution:
          description: Decisión del moderador (`null` mientras la denuncia está `OPEN`).
          oneOf:
            - $ref: '#/components/schemas/ReportResolution'
            - type: 'null'
        resolutionNote:
          type: [string, 'null']
          maxLength: 500
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: [string, 'null']
          format: date-time

    ContentReportPage:
      allOf:
        - $ref: './shared/components.yaml#/components/schemas/CursorPageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ContentReport'

    ResolveContentReportRequest:
      type: object
      required: [resolution]
      properties:
        resolution:
          $ref: '#/components/schemas/ReportResolution'
        note:
          type: string
          maxLength: 500

    UpdatePostStatusRequest:
      type: object
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [PUBLISHED, HIDDEN, REMOVED]
        reason:
          type: string
          minLength: 3
          maxLength: 500

    ContentDailyStats:
      type: object
      required: [from, to, days, topHashtags]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: array
          items:
            type: object
            required: [date, postsCreated, commentsCreated, reactionsSet, followsCreated, activeAuthors, postsHidden]
            properties:
              date:
                type: string
                format: date
              postsCreated:
                type: integer
                format: int64
              commentsCreated:
                type: integer
                format: int64
              reactionsSet:
                type: integer
                format: int64
              followsCreated:
                type: integer
                format: int64
              activeAuthors:
                type: integer
                format: int64
              postsHidden:
                type: integer
                format: int64
        topHashtags:
          type: array
          items:
            type: object
            required: [hashtag, count]
            properties:
              hashtag:
                type: string
              count:
                type: integer
                format: int64

  securitySchemes:
    bearerAuth:
      $ref: './shared/components.yaml#/components/securitySchemes/bearerAuth'
    serviceAuth:
      $ref: './shared/components.yaml#/components/securitySchemes/serviceAuth'
