          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/components.yaml#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/UniversityDomainTaken'

  /internal/v1/universities/{universityId}:
    parameters:
      - name: universityId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 0191c0de-1111-7aaa-8bbb-000000000001
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    patch:
      tags: [internal]
      operationId: updateUniversity
      summary: Actualizar universidad (interno)
      description: Modifica nombre, dominios permitidos o habilitación. Solo se cambian los campos presentes. Deshabilitar no afecta a usuarios existentes; solo impide nuevos registros.
      servers:
        - url: http://identity-service:7001
          description: Red interna (Docker/VPC); el gateway bloquea /internal/**
      security:
        - serviceAuth: []
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/ActorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUniversityRequest'
            examples:
              agregarDominio:
                summary: Agregar un dominio
                value:
                  allowedDomains: [umsa.bo, est.umsa.bo]
      responses:
        '200':
          description: Universidad actualizada.
          headers:
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/University'
              examples:
                actualizada:
                  summary: Universidad actualizada
                  value:
                    id: 0191c0de-1111-7aaa-8bbb-000000000001
                    name: Universidad Mayor de San Andrés
                    allowedDomains: [umsa.bo, est.umsa.bo]
                    enabled: true
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/components.yaml#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/UniversityDomainTaken'

components:
  parameters:
    ClientMode:
      name: X-Bandada-Client
      in: header
      required: false
      description: |
        Tipo de cliente. `native` (por defecto): `aud=bandada-app`, refresh en el cuerpo. `web`: `aud=bandada-app`, refresh en cookie `bandada_rt`.
        `admin`: `aud=bandada-admin`, refresh en cookie `bandada_admin_rt`. Valor desconocido → `400`.
      schema:
        type: string
        enum: [native, web, admin]
        default: native
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 0192f1a2-3b4c-7d5e-8f60-718293a4b5c6

  responses:
    AuthTokens:
      description: Sesión iniciada; tokens emitidos.
      headers:
        Set-Cookie:
          description: |
            Solo con `X-Bandada-Client: web|admin`: cookie `bandada_rt` (web) o `bandada_admin_rt` (admin) con el refresh token,
            `HttpOnly; SameSite=Strict; Path=/api/v1/auth` (+ `Secure` salvo `COOKIE_SECURE=false`).
          schema:
            type: string
          example: bandada_rt=rt_9mQ2xY7kL1pZ4vB8nC3sD6fG0hJ5wE2r; Path=/api/v1/auth; Max-Age=2592000; HttpOnly; SameSite=Strict
        Cache-Control:
          description: Las respuestas con tokens no se cachean.
          schema:
            type: string
          example: no-store
        Content-Language:
          $ref: './shared/components.yaml#/components/headers/ContentLanguage'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthTokens'
          examples:
            sesion:
              summary: Sesión de estudiante
              value:
                accessToken: eyJhbGciOiJSUzI1NiIsImtpZCI6ImJhbmRhZGEtMjAyNi0xMCIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIwMTkyZjFhMiJ9.c2lnbmF0dXJh
                refreshToken: rt_9mQ2xY7kL1pZ4vB8nC3sD6fG0hJ5wE2r
                tokenType: Bearer
                expiresIn: 900
                refreshExpiresIn: 2592000
                user:
                  id: 0192f1a2-3b4c-7d5e-8f60-718293a4b5c6
                  email: ana.quispe@umsa.bo
                  universityId: 0191c0de-1111-7aaa-8bbb-000000000001
                  status: ACTIVE
                  roles: [STUDENT]
                  locale: es
                  theme: SYSTEM
                  emailVerifiedAt: '2026-10-01T14:12:00Z'
                  createdAt: '2026-10-01T14:05:00Z'
                  updatedAt: '2026-10-01T14:12:00Z'

    UniversityDomainTaken:
      description: Algún dominio ya pertenece a otra universidad (`UNIVERSITY_DOMAIN_TAKEN`).
      content:
        application/problem+json:
          schema:
            $ref: './shared/components.yaml#/components/schemas/Problem'
          examples:
            dominioOcupado:
              summary: Dominio ocupado
              value:
                type: https://api.bandadau.com/problems/university-domain-taken
                title: Dominio ya registrado
                status: 409
                detail: El dominio umsa.bo ya pertenece a otra universidad.
                instance: /internal/v1/universities
                code: UNIVERSITY_DOMAIN_TAKEN
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736

  examples:
    UserAna:
      summary: Estudiante organizadora
      value:
        id: 0192f1a2-3b4c-7d5e-8f60-718293a4b5c6
        email: ana.quispe@umsa.bo
        universityId: 0191c0de-1111-7aaa-8bbb-000000000001
        status: ACTIVE
        roles: [STUDENT, ORGANIZER]
        locale: es
        theme: SYSTEM
        emailVerifiedAt: '2026-10-01T14:12:00Z'
        createdAt: '2026-10-01T14:05:00Z'
        updatedAt: '2026-10-10T09:00:00Z'

  schemas:
    UserStatus:
      type: string
      enum: [PENDING_VERIFICATION, ACTIVE, SUSPENDED, DELETED]

    HandoffTargetApp:
      type: string
      enum: [ADMIN, APP]
      description: App destino del traspaso SSO.

    Email:
      type: string
      format: email
      maxLength: 254
      examples: [ana.quispe@umsa.bo]

    Password:
      type: string
      minLength: 8
      maxLength: 128
      writeOnly: true
      description: Contraseña (se guarda con Argon2id). Mínimo 8 caracteres.

    User:
      type: object
      required: [id, email, universityId, status, roles, locale, theme, emailVerifiedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          $ref: '#/components/schemas/Email'
        universityId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/UserStatus'
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: './shared/components.yaml#/components/schemas/Role'
        locale:
          $ref: './shared/components.yaml#/components/schemas/Locale'
        theme:
          $ref: './shared/components.yaml#/components/schemas/ThemePreference'
        emailVerifiedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserPage:
      allOf:
        - $ref: './shared/components.yaml#/components/schemas/CursorPageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/User'

    RegisterUserRequest:
      type: object
      required: [email, password, universityId]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        universityId:
          type: string
          format: uuid
        locale:
          $ref: './shared/components.yaml#/components/schemas/Locale'

    RegisterUserResponse:
      type: object
      required: [userId, email, status, verificationExpiresIn]
      properties:
        userId:
          type: string
          format: uuid
        email:
          $ref: '#/components/schemas/Email'
        status:
          $ref: '#/components/schemas/UserStatus'
        verificationExpiresIn:
          type: integer
          description: Segundos de validez del código enviado (900).

    VerifyEmailRequest:
      type: object
      required: [email, code]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Código de 6 dígitos.

    ResendVerificationCodeRequest:
      type: object
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 16
          maxLength: 512

    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 16
          maxLength: 512

    AuthTokens:
      type: object
      required: [accessToken, tokenType, expiresIn, refreshExpiresIn, user]
      properties:
        accessToken:
          type: string
          description: JWT RS256 de acceso (`typ=user`, `aud` = `bandada-app` o `bandada-admin`).
        refreshToken:
          type: string
          description: 'Refresh token opaco y rotativo. **Ausente** con `X-Bandada-Client: web|admin` (viaja en la cookie `HttpOnly`).'
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Segundos de vida del access token (900).
        refreshExpiresIn:
          type: integer
          description: Segundos de vida del refresh token (2 592 000 = 30 días).
        user:
          $ref: '#/components/schemas/User'

    CreateHandoffCodeRequest:
      type: object
      required: [targetApp, codeChallenge, codeChallengeMethod]
      properties:
        targetApp:
          $ref: '#/components/schemas/HandoffTargetApp'
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43,128}$'
          description: '`BASE64URL(SHA256(codeVerifier))` (PKCE).'
        codeChallengeMethod:
          type: string
          const: S256

    HandoffCode:
      type: object
      required: [code, redirectUrl, expiresIn]
      properties:
        code:
          type: string
          description: Código de un solo uso.
        redirectUrl:
          type: string
          format: uri
          description: URL de callback de la app destino con el código (`/sso/callback?code=…`).
        expiresIn:
          type: integer
          const: 60
          description: Segundos de validez.

    ExchangeHandoffCodeRequest:
      type: object
      required: [code, codeVerifier]
      properties:
        code:
          type: string
          minLength: 16
          maxLength: 256
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: Verificador PKCE (RFC 7636).

    ServiceTokenRequest:
      type: object
      required: [clientId, clientSecret]
      properties:
        clientId:
          type: string
          description: Nombre del servicio cliente.
          examples: [admin-gateway]
        clientSecret:
          type: string
          writeOnly: true
        scopes:
          type: array
          items:
            type: string

    ServiceToken:
      type: object
      required: [accessToken, tokenType, expiresIn, scopes]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
        scopes:
          type: array
          items:
            type: string

    CreateMcpTokenRequest:
      type: object
      properties:
        label:
          type: string
          maxLength: 80
          description: Nombre descriptivo para reconocer el token en el panel (opcional).

    McpToken:
      type: object
      required: [id, accessToken, tokenType, audience, scopes, label, expiresIn, expiresAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador del token (`jti`); se usa para revocarlo.
        accessToken:
          type: string
          description: JWT RS256 (`typ=mcp`). Se devuelve una sola vez.
        tokenType:
          type: string
          const: Bearer
        audience:
          type: string
          const: mcp
        scopes:
          type: array
          items:
            type: string
            enum: [mcp:tools]
        label:
          type: [string, 'null']
        expiresIn:
          type: integer
          const: 28800
          description: Segundos de vida (8 h).
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    UpdatePreferencesRequest:
      type: object
      minProperties: 1
      properties:
        locale:
          $ref: './shared/components.yaml#/components/schemas/Locale'
        theme:
          $ref: './shared/components.yaml#/components/schemas/ThemePreference'

    UpdateUserRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: './shared/components.yaml#/components/schemas/Role'

    UpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, SUSPENDED]
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Obligatorio cuando `status = SUSPENDED`.
      if:
        properties:
          status:
            const: SUSPENDED
      then:
        required: [reason]

    University:
      type: object
      required: [id, name, allowedDomains, enabled]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 3
          maxLength: 150
        allowedDomains:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Domain'
        enabled:
          type: boolean
          description: Si admite registros nuevos ("universidad habilitada", RF-01). Aceptado en el modelo de dominio por ADR-0016.

    UniversityPage:
      allOf:
        - $ref: './shared/components.yaml#/components/schemas/CursorPageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/University'

    Domain:
      type: string
      pattern: '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}$'
      description: Dominio de correo en minúsculas (sin `@`).

    CreateUniversityRequest:
      type: object
      required: [name, allowedDomains]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 150
        allowedDomains:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Domain'

    UpdateUniversityRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 150
        allowedDomains:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Domain'
        enabled:
          type: boolean

    Jwk:
      type: object
      required: [kty, kid, use, alg, n, e]
      properties:
        kty:
          type: string
          const: RSA
        kid:
          type: string
        use:
          type: string
          const: sig
        alg:
          type: string
          const: RS256
        n:
          type: string
        e:
          type: string

    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Jwk'

  securitySchemes:
    bearerAuth:
      $ref: './shared/components.yaml#/components/securitySchemes/bearerAuth'
    serviceAuth:
      $ref: './shared/components.yaml#/components/securitySchemes/serviceAuth'
