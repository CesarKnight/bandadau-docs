openapi: 3.1.0
info:
  title: Bandada U — identity-service
  version: 1.2.0
  summary: Identidad y acceso (registro, verificación, sesión, SSO handoff, usuarios y universidades).
  description: |
    API del bounded context **Identidad** (`identity-service`, Java 25 + Spring Boot 4,
    arquitectura Hexagonal, PostgreSQL `identity_db`). Es el único proveedor de identidad para
    la app, el panel y el servidor MCP (D4).

    - Access token JWT **RS256** (15 min) + refresh token rotativo (30 días). Reutilizar un
      refresh revocado revoca toda la familia (RF-03).
    - Registro solo con correo de un dominio de universidad habilitada (RF-01) y verificación
      por código de 6 dígitos (15 min, máx. 5 intentos; RF-02).
    - Acceso por una sola entrada mediante **handoff code** + PKCE (`S256`), un solo uso, 60 s (D4, RF-04).
    - Preferencias de idioma (`locale`) y tema (`theme`) sincronizadas en la cuenta (D13, D14).
    - Errores RFC 9457 (`application/problem+json`); `title`/`detail` localizados según
      `Accept-Language` (`es` por defecto) y respuesta con `Content-Language`. Los clientes traducen por `code`.
    - Todas las respuestas devuelven `X-Correlation-Id`.
    - Rutas `/internal/v1/**` (tag `internal`): solo red interna, token de servicio (`serviceAuth`);
      el gateway las bloquea (403).

    ## Modos de cliente y refresh token
    La cabecera `X-Bandada-Client` (`native` por defecto, `web`, `admin`) declara el tipo de cliente en
    `verify-email`, `login`, `refresh`, `logout` y `handoff/exchange`:

    | Valor | Audiencia (`aud`) | Refresh token |
    |---|---|---|
    | `native` | `bandada-app` | En el cuerpo (`AuthTokens.refreshToken`); el cliente lo guarda en Keychain/Keystore |
    | `web` | `bandada-app` | **No** va en el cuerpo: cookie `HttpOnly` `bandada_rt` |
    | `admin` | `bandada-admin` | **No** va en el cuerpo: cookie `HttpOnly` `bandada_admin_rt` |

    La cookie se fija con `Set-Cookie` (`HttpOnly; SameSite=Strict; Path=/api/v1/auth; Max-Age=<refreshExpiresIn>`, `Secure`
    salvo `COOKIE_SECURE=false` en dev). En `refresh` y `logout` con cliente `web`/`admin` el cuerpo se omite y el servidor lee la
    cookie (el `Origin`, si viene, debe estar en `CORS_ORIGINS`, si no `403 FORBIDDEN`); si no hay cookie, `401 INVALID_REFRESH_TOKEN`.
    Un valor de `X-Bandada-Client` desconocido responde `400 VALIDATION_FAILED`.

    ## Claims de los tokens
    Access token de usuario: `iss`, `aud` (`bandada-app` | `bandada-admin`), `sub` (userId), `typ=user`, `roles[]`, `uni`, `locale`, `scope` (vacío), `jti`, `iat`, `exp`.
    Token de servicio: `aud=bandada-internal`, `typ=service`, `sub` = `client_id` = clientId, `scope` (lista separada por espacios). Los servicios validan
    `typ=service` y `aud=bandada-internal` en `/internal/v1/**`; **en la fase 1 no se exigen scopes concretos** (se emiten `internal:read internal:write`).

    ## Changelog
    - 1.2.0 (2026-10-15): consolidación fase 1 — cabecera `X-Bandada-Client` y cookie de refresh (`bandada_rt` / `bandada_admin_rt`);
      `AuthTokens.refreshToken` opcional (ausente en web/admin) y cuerpo opcional en `refresh`/`logout`; claims reales (`typ=user|service`,
      `aud=bandada-app|bandada-admin|bandada-internal`, `uni`); filtro `ids` en `searchUsers`; `INVALID_REFRESH_TOKEN`, `HANDOFF_CODE_INVALID` 401,
      `INVALID_VERIFICATION_CODE` 422; `REGISTER_HIDE_EXISTING_ACCOUNTS`; `displayName` derivado del correo; 429 `RATE_LIMITED`
      con `Retry-After`; `LAST_ADMIN`, `INVALID_STATUS_TRANSITION`, `UNIVERSITY_DOMAIN_TAKEN`, `CONCURRENT_MODIFICATION`, `FEATURE_DISABLED` (501 en `mcp-tokens`).
    - 1.1.0 (2026-10-14): `createMcpToken` / `revokeMcpToken` (token MCP de 8 h, `aud=mcp`, scope `mcp:tools`; D15, ADR-0016); `University.enabled` deja de ser propuesta.
    - 1.0.0 (2026-10-14): versión inicial contract-first (D1, D3, D4, D13, D14).
  contact:
    name: Grupo 24 — Ingeniería de Software II
servers:
  - url: http://api.bandada.localhost/api/v1
    description: Desarrollo local (Traefik)
  - url: https://api.bandadau.com/api/v1
    description: Producción
tags:
  - name: auth
    description: Registro, verificación de correo, sesión y SSO handoff.
  - name: users
    description: Usuario autenticado y sus preferencias.
  - name: universities
    description: Universidades habilitadas para el registro.
  - name: jwks
    description: Llaves públicas para validar los JWT.
  - name: internal
    description: Endpoints internos (`/internal/v1`), solo con token de servicio. Consumidos por `admin-gateway`.
security:
  - bearerAuth: []
paths:
  /auth/register:
    parameters:
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    post:
      tags: [auth]
      operationId: registerUser
      summary: Registrarse con correo institucional
      description: |
        Crea un usuario en estado `PENDING_VERIFICATION` y envía al correo un código de
        verificación de 6 dígitos (válido 15 min). El dominio del correo debe pertenecer a la
        universidad indicada y estar habilitado (UC-01, RF-01, RF-02). Publica
        `bandada.identity.user.registered.v1` al verificarse el correo.
        Si no se envía `locale`, se toma el de `Accept-Language` (por defecto `es`).
        El contrato no recibe nombre: el `displayName` del usuario (evento `user.registered` → `Profile` inicial)
        se **deriva de la parte local del correo** (`ana.quispe` → `Ana Quispe`, máx. 80 caracteres) y el usuario lo edita luego en su perfil (UC-04).
        Con `REGISTER_HIDE_EXISTING_ACCOUNTS=true` (anti-enumeración, desactivado por defecto) un correo ya activo
        también responde `201` y se avisa al titular por correo, en vez de `409 EMAIL_ALREADY_REGISTERED`.
        Falta de `Idempotency-Key` → `400 IDEMPOTENCY_KEY_REQUIRED`.
      security: []
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
            examples:
              estudiante:
                summary: Estudiante de la UMSA
                value:
                  email: ana.quispe@umsa.bo
                  password: 'Cóndor-Illimani-2026'
                  universityId: 0191c0de-1111-7aaa-8bbb-000000000001
                  locale: es
      responses:
        '201':
          description: Usuario creado; código de verificación enviado.
          headers:
            Idempotent-Replayed:
              $ref: './shared/components.yaml#/components/headers/IdempotentReplayed'
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
            X-Correlation-Id:
              $ref: './shared/components.yaml#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterUserResponse'
              examples:
                pendiente:
                  summary: Pendiente de verificación
                  value:
                    userId: 0192f1a2-3b4c-7d5e-8f60-718293a4b5c6
                    email: ana.quispe@umsa.bo
                    status: PENDING_VERIFICATION
                    verificationExpiresIn: 900
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '409':
          description: El correo ya está registrado, o hay una petición idéntica en curso (`IDEMPOTENCY_IN_PROGRESS`).
          content:
            application/problem+json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Problem'
              examples:
                correoRegistrado:
                  summary: Correo ya registrado
                  value:
                    type: https://api.bandadau.com/problems/email-already-registered
                    title: Correo ya registrado
                    status: 409
                    detail: Ya existe una cuenta con este correo. Inicia sesión o recupera tu contraseña.
                    instance: /api/v1/auth/register
                    code: EMAIL_ALREADY_REGISTERED
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '422':
          description: |
            Regla de negocio violada: `EMAIL_DOMAIN_NOT_ALLOWED` (el dominio no pertenece a la
            universidad o no está habilitado), `UNIVERSITY_NOT_FOUND`, `WEAK_PASSWORD` o
            `IDEMPOTENCY_KEY_REUSED`.
          content:
            application/problem+json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Problem'
              examples:
                dominioNoPermitido:
                  summary: Dominio no habilitado
                  value:
                    type: https://api.bandadau.com/problems/email-domain-not-allowed
                    title: Correo no institucional
                    status: 422
                    detail: El dominio gmail.com no pertenece a una universidad habilitada.
                    instance: /api/v1/auth/register
                    code: EMAIL_DOMAIN_NOT_ALLOWED
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                claveReutilizada:
                  summary: Idempotency-Key reutilizada
                  value:
                    type: https://api.bandadau.com/problems/idempotency-key-reused
                    title: Clave de idempotencia reutilizada
                    status: 422
                    detail: La Idempotency-Key ya se usó con una petición diferente.
                    instance: /api/v1/auth/register
                    code: IDEMPOTENCY_KEY_REUSED
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '429':
          $ref: './shared/components.yaml#/components/responses/TooManyRequests'

  /auth/verify-email:
    parameters:
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Verificar el correo con el código
      description: |
        Valida el código de 6 dígitos enviado por correo (válido 15 min, máx. 5 intentos).
        Si es correcto activa la cuenta (`ACTIVE`) y devuelve los tokens de sesión (UC-01, RF-02).
        Por seguridad, código inexistente, incorrecto o expirado devuelven el mismo `code`
        (`INVALID_VERIFICATION_CODE`), salvo que se agoten los intentos.
      parameters:
        - $ref: '#/components/parameters/ClientMode'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
            examples:
              codigo:
                summary: Código recibido por correo
                value:
                  email: ana.quispe@umsa.bo
                  code: '483920'
      responses:
        '200':
          $ref: '#/components/responses/AuthTokens'
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '409':
          description: El correo ya estaba verificado (`EMAIL_ALREADY_VERIFIED`).
          content:
            application/problem+json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Problem'
              examples:
                yaVerificado:
                  summary: Ya verificado
                  value:
                    type: https://api.bandadau.com/problems/email-already-verified
                    title: Correo ya verificado
                    status: 409
                    detail: Esta cuenta ya fue verificada. Inicia sesión.
                    instance: /api/v1/auth/verify-email
                    code: EMAIL_ALREADY_VERIFIED
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '422':
          description: Código incorrecto o expirado (`INVALID_VERIFICATION_CODE`) o intentos agotados (`VERIFICATION_ATTEMPTS_EXCEEDED`, hay que pedir un código nuevo).
          content:
            application/problem+json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Problem'
              examples:
                codigoInvalido:
                  summary: Código incorrecto
                  value:
                    type: https://api.bandadau.com/problems/invalid-verification-code
                    title: Código inválido
                    status: 422
                    detail: El código es incorrecto o expiró. Te quedan 3 intentos.
                    instance: /api/v1/auth/verify-email
                    code: INVALID_VERIFICATION_CODE
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                    remainingAttempts: 3
                intentosAgotados:
                  summary: Intentos agotados
                  value:
                    type: https://api.bandadau.com/problems/verification-attempts-exceeded
                    title: Intentos agotados
                    status: 422
                    detail: Superaste los 5 intentos. Solicita un código nuevo.
                    instance: /api/v1/auth/verify-email
                    code: VERIFICATION_ATTEMPTS_EXCEEDED
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '429':
          $ref: './shared/components.yaml#/components/responses/TooManyRequests'

  /auth/resend-code:
    parameters:
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    post:
      tags: [auth]
      operationId: resendVerificationCode
      summary: Reenviar el código de verificación
      description: |
        Genera y envía un código nuevo (invalida el anterior y reinicia los intentos).
        Siempre responde `202` aunque el correo no exista o ya esté verificado, para no
        revelar qué cuentas existen. Con límite de peticiones (rate-limit) por correo e IP.
      security: []
      x-idempotency-exempt: Reenviar es inocuo (solo el último código es válido) y está limitado por rate-limit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationCodeRequest'
            examples:
              reenvio:
                summary: Reenvío
                value:
                  email: ana.quispe@umsa.bo
      responses:
        '202':
          description: Solicitud aceptada. Si la cuenta está pendiente, se envió un código nuevo.
          headers:
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '429':
          $ref: './shared/components.yaml#/components/responses/TooManyRequests'

  /auth/login:
    parameters:
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    post:
      tags: [auth]
      operationId: login
      summary: Iniciar sesión
      description: |
        Autentica con correo y contraseña y devuelve access token (15 min), refresh token
        (30 días) y el usuario (UC-02, RF-03). Rate-limit 10/min/IP (RNF-06).
      parameters:
        - $ref: '#/components/parameters/ClientMode'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              credenciales:
                summary: Inicio de sesión
                value:
                  email: ana.quispe@umsa.bo
                  password: 'Cóndor-Illimani-2026'
      responses:
        '200':
          $ref: '#/components/responses/AuthTokens'
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '401':
          description: Correo o contraseña incorrectos (`INVALID_CREDENTIALS`).
          content:
            application/problem+json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Problem'
              examples:
                credencialesInvalidas:
                  summary: Credenciales inválidas
                  value:
                    type: https://api.bandadau.com/problems/invalid-credentials
                    title: Credenciales inválidas
                    status: 401
                    detail: El correo o la contraseña no son correctos.
                    instance: /api/v1/auth/login
                    code: INVALID_CREDENTIALS
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '403':
          description: Cuenta sin verificar (`EMAIL_NOT_VERIFIED`) o suspendida (`ACCOUNT_SUSPENDED`).
          content:
            application/problem+json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Problem'
              examples:
                noVerificado:
                  summary: Correo sin verificar
                  value:
                    type: https://api.bandadau.com/problems/email-not-verified
                    title: Correo sin verificar
                    status: 403
                    detail: Verifica tu correo con el código que te enviamos antes de iniciar sesión.
                    instance: /api/v1/auth/login
                    code: EMAIL_NOT_VERIFIED
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                suspendida:
                  summary: Cuenta suspendida
                  value:
                    type: https://api.bandadau.com/problems/account-suspended
                    title: Cuenta suspendida
                    status: 403
                    detail: Tu cuenta está suspendida. Contacta a soporte.
                    instance: /api/v1/auth/login
                    code: ACCOUNT_SUSPENDED
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '429':
          $ref: './shared/components.yaml#/components/responses/TooManyRequests'

  /auth/refresh:
    parameters:
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Renovar tokens
      description: |
        Intercambia un refresh token válido por un par nuevo (rotación). El refresh usado queda
        revocado. Si se presenta un refresh ya revocado, se revoca toda la familia de tokens
        (posible robo) y se responde `401 REFRESH_TOKEN_REUSED` (RF-03). Cada rotación emite un
        refresh nuevo (cuerpo en `native`, cookie en `web`/`admin`; ver «Modos de cliente»).
      parameters:
        - $ref: '#/components/parameters/ClientMode'
      security: []
      requestBody:
        required: false
        description: Obligatorio con `native`; con `web`/`admin` se omite y el refresh se toma de la cookie `bandada_rt` / `bandada_admin_rt`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            examples:
              renovar:
                summary: Renovación
                value:
                  refreshToken: rt_9mQ2xY7kL1pZ4vB8nC3sD6fG0hJ5wE2r
      responses:
        '200':
          $ref: '#/components/responses/AuthTokens'
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '401':
          description: Refresh inválido, ausente o expirado (`INVALID_REFRESH_TOKEN`), reutilizado (`REFRESH_TOKEN_REUSED`) o cuenta suspendida (`ACCOUNT_SUSPENDED`).
          content:
            application/problem+json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Problem'
              examples:
                reutilizado:
                  summary: Refresh reutilizado
                  value:
                    type: https://api.bandadau.com/problems/refresh-token-reused
                    title: Sesión revocada
                    status: 401
                    detail: Detectamos un uso indebido de tu sesión y la cerramos en todos tus dispositivos. Vuelve a iniciar sesión.
                    instance: /api/v1/auth/refresh
                    code: REFRESH_TOKEN_REUSED
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '429':
          $ref: './shared/components.yaml#/components/responses/TooManyRequests'

  /auth/logout:
    parameters:
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    post:
      tags: [auth]
      operationId: logout
      summary: Cerrar sesión
      description: Revoca el refresh token indicado (cuerpo en `native`, cookie en `web`/`admin`; RF-03). Idempotente por naturaleza; revocar un token ya revocado también responde `204`.
      parameters:
        - $ref: '#/components/parameters/ClientMode'
      requestBody:
        required: false
        description: Obligatorio con `native`; con `web`/`admin` se omite y se usa la cookie (que la respuesta borra con `Set-Cookie ... Max-Age=0`).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
            examples:
              salir:
                summary: Cerrar sesión
                value:
                  refreshToken: rt_9mQ2xY7kL1pZ4vB8nC3sD6fG0hJ5wE2r
      responses:
        '204':
          description: Sesión cerrada.
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'

  /auth/handoff:
    parameters:
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    post:
      tags: [auth]
      operationId: createHandoffCode
      summary: Crear código de traspaso (SSO)
      description: |
        Genera un código de un solo uso (32 bytes aleatorios, guardado hasheado, 60 s) ligado al
        usuario y a la app destino, para abrir el panel desde la app (o la app desde el panel)
        sin volver a ingresar credenciales (D4, UC-03, RF-04). El cliente genera un
        `codeVerifier` y envía su `codeChallenge = BASE64URL(SHA256(codeVerifier))`.
        Para `targetApp = ADMIN` el usuario debe tener rol `MODERATOR` o `ADMIN`.
      x-idempotency-exempt: Cada llamada debe producir un código nuevo de un solo uso; repetirla no tiene efectos acumulativos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHandoffCodeRequest'
            examples:
              alPanel:
                summary: De la app al panel
                value:
                  targetApp: ADMIN
                  codeChallenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
                  codeChallengeMethod: S256
      responses:
        '201':
          description: Código creado.
          headers:
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffCode'
              examples:
                codigo:
                  summary: Código de traspaso
                  value:
                    code: hc_Q2FtYmlhcl9lc3RvX2VuX3Byb2R1Y2Npb24
                    redirectUrl: http://admin.bandada.localhost/sso/callback?code=hc_Q2FtYmlhcl9lc3RvX2VuX3Byb2R1Y2Npb24
                    expiresIn: 60
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/components.yaml#/components/responses/Forbidden'
        '429':
          $ref: './shared/components.yaml#/components/responses/TooManyRequests'

  /auth/handoff/exchange:
    parameters:
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    post:
      tags: [auth]
      operationId: exchangeHandoffCode
      summary: Canjear código de traspaso
      description: |
        La app destino canjea el código junto con el `codeVerifier` (PKCE) y recibe tokens
        emitidos para ella (`aud` de la app destino). El código se marca usado (`usedAt`) aunque
        el canje falle por PKCE. Código inexistente, expirado, ya usado, de otra app o PKCE
        incorrecto → `401 HANDOFF_CODE_INVALID` (mismo código para no filtrar información).
      parameters:
        - $ref: '#/components/parameters/ClientMode'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeHandoffCodeRequest'
            examples:
              canje:
                summary: Canje desde el panel
                value:
                  code: hc_Q2FtYmlhcl9lc3RvX2VuX3Byb2R1Y2Npb24
                  codeVerifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
      responses:
        '200':
          $ref: '#/components/responses/AuthTokens'
        '400':
