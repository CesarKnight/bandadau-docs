                    type: https://api.bandadau.com/problems/handoff-code-invalid
                    title: Código de acceso inválido
                    status: 401
                    detail: El enlace de acceso expiró o ya fue usado. Vuelve a abrir el panel desde la app.
                    instance: /api/v1/auth/handoff/exchange
                    code: HANDOFF_CODE_INVALID
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '429':
          $ref: './shared/components.yaml#/components/responses/TooManyRequests'

  /auth/service-token:
    parameters:
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    post:
      tags: [auth]
      operationId: issueServiceToken
      summary: Emitir token de servicio
      description: |
        Flujo *client credentials* para servicios internos (`admin-gateway`,
        `insights-service`, n8n). Devuelve un JWT `typ=service`, `aud=bandada-internal`, `sub`=`client_id`=clientId, usado en `serviceAuth`. Vida 5 min (`SERVICE_TOKEN_TTL`). `scopes` pedidos se intersectan con los permitidos al cliente (`SERVICE_CLIENTS`); si se omiten, se conceden todos los del cliente. En la fase 1 los servicios **no exigen scopes** en `/internal/v1/**`: validan `typ=service` y `aud=bandada-internal`.
        **Solo red interna**: debe invocarse contra `identity-service:7001`; no se publica en
        el gateway. *Propuesta*: que Traefik bloquee `/api/v1/auth/service-token` igual que `/internal/**`.
      servers:
        - url: http://identity-service:7001/api/v1
          description: Red interna (Docker/VPC)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceTokenRequest'
            examples:
              gateway:
                summary: admin-gateway
                value:
                  clientId: admin-gateway
                  clientSecret: '<secreto-desde-variables-de-entorno>'
                  scopes: [internal:read, internal:write]
      responses:
        '200':
          description: Token de servicio emitido.
          headers:
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceToken'
              examples:
                token:
                  summary: Token de servicio
                  value:
                    accessToken: eyJhbGciOiJSUzI1NiIsImtpZCI6ImsxIiwidHlwIjoiSldUIn0.eyJzdWIiOiJhZG1pbi1nYXRld2F5In0.c2lnbmF0dXJh
                    tokenType: Bearer
                    expiresIn: 300
                    scopes: [internal:read, internal:write]
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '401':
          description: Credenciales de cliente inválidas (`INVALID_CLIENT`).
          content:
            application/problem+json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Problem'
              examples:
                clienteInvalido:
                  summary: Cliente inválido
                  value:
                    type: https://api.bandadau.com/problems/invalid-client
                    title: Cliente inválido
                    status: 401
                    detail: Las credenciales del servicio no son válidas.
                    instance: /api/v1/auth/service-token
                    code: INVALID_CLIENT
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736

  /auth/mcp-tokens:
    parameters:
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    post:
      tags: [auth]
      operationId: createMcpToken
      summary: Crear token MCP para clientes externos
      description: |
        Emite un token dedicado para que un cliente MCP externo (p. ej. Claude Desktop) consulte el
        servidor MCP de `insights-service` (UC-22, D9, D15, ADR-0016). Solo rol `ADMIN`; se emite
        desde el panel (`createMcpToken` en GraphQL).

        - JWT RS256 con `aud = mcp`, `scope = mcp:tools`, `typ = mcp` y vigencia de **8 h**
          (28 800 s); no tiene refresh token.
        - Su `jti` (= `id`) queda registrado en `identity_db` para poder revocarlo con `revokeMcpToken`.
        - El token se devuelve **una sola vez** en esta respuesta; no se puede volver a consultar.
      x-idempotency-exempt: Cada llamada debe emitir un token nuevo (con su propio `jti`) que se muestra una sola vez; repetirla no tiene efectos acumulativos sobre otros recursos.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMcpTokenRequest'
            examples:
              claudeDesktop:
                summary: Token para Claude Desktop
                value:
                  label: Claude Desktop — laptop de Ana
      responses:
        '201':
          description: Token MCP emitido. Se muestra una sola vez.
          headers:
            Cache-Control:
              description: Las respuestas con tokens no se cachean.
              schema:
                type: string
              example: no-store
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpToken'
              examples:
                token:
                  summary: Token MCP de 8 h
                  value:
                    id: 0192f6c1-8a2b-7c3d-9e4f-5a6b7c8d9e0f
                    accessToken: eyJhbGciOiJSUzI1NiIsImtpZCI6ImJhbmRhZGEtMjAyNi0xMCIsInR5cCI6Im1jcCJ9.eyJzdWIiOiIwMTkyZjFhMiIsImF1ZCI6Im1jcCJ9.c2lnbmF0dXJh
                    tokenType: Bearer
                    audience: mcp
                    scopes: [mcp:tools]
                    label: Claude Desktop — laptop de Ana
                    expiresIn: 28800
                    expiresAt: '2026-10-14T23:04:05Z'
                    createdAt: '2026-10-14T15:04:05Z'
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/components.yaml#/components/responses/Forbidden'
        '429':
          $ref: './shared/components.yaml#/components/responses/TooManyRequests'

  /auth/mcp-tokens/{tokenId}:
    parameters:
      - name: tokenId
        in: path
        required: true
        description: Identificador del token MCP (su `jti`).
        schema:
          type: string
          format: uuid
        example: 0192f6c1-8a2b-7c3d-9e4f-5a6b7c8d9e0f
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    delete:
      tags: [auth]
      operationId: revokeMcpToken
      summary: Revocar un token MCP
      description: |
        Revoca un token MCP antes de que expire (UC-22, ADR-0016). Solo rol `ADMIN`. El servidor MCP
        rechaza el `jti` revocado desde la siguiente petición. Idempotente por naturaleza: revocar un
        token ya revocado o expirado también responde `204`.
      responses:
        '204':
          description: Token revocado.
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/components.yaml#/components/responses/NotFound'

