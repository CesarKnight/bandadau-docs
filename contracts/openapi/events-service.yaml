  /internal/v1/sagas/{sagaId}/retry:
    parameters:
      - name: sagaId
        in: path
        required: true
        description: Identificador de la instancia de SAGA.
        schema:
          type: string
          format: uuid
        example: 0192f3c1-2d3e-7f41-b263-748596a7b8c9
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    post:
      tags: [internal]
      operationId: retrySaga
      summary: Reimpulsar una SAGA fallida (interno)
      description: |
        Reimpulsa una SAGA `FAILED` desde el paso en que quedó (p. ej. `REFUND_CREDITS` tras una
        caída de `wallet-service`): reinicia `retries`, fija un nuevo `deadlineAt` y vuelve a enviar
        el comando del paso con la **misma** `idempotencyKey = <sagaId>:<step>`, por lo que los
        participantes no duplican efectos (UC-13 10b, D2, D15). Solo `ADMIN` desde el panel
        (mutación GraphQL `retrySaga`); se audita con `X-Actor-Id`. Responde **202** con la SAGA en
        su nuevo estado intermedio; el resultado final se observa con `listSagas`.
      x-idempotency-exempt: Idempotente por naturaleza; si la SAGA ya no está `FAILED` (porque un reintento anterior la reanudó) se devuelve su estado actual sin reenviar comandos, y los comandos reusan la idempotencyKey del paso.
      servers:
        - url: http://events-service:7004
          description: Red interna (Docker/VPC)
      security:
        - serviceAuth: []
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/ActorId'
      responses:
        '202':
          description: SAGA reanudada (o ya en curso).
          headers:
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SagaInstance'
              examples:
                reanudada:
                  summary: Cancelación reanudada en REFUND_CREDITS
                  value:
                    id: 0192f3c1-2d3e-7f41-b263-748596a7b8c9
                    type: CANCELLATION
                    registrationId: 0192f3c1-2d3e-7f40-a152-637485960a1b
                    eventId: 0192f3b0-7c1e-7a2b-9c3d-4e5f60718293
                    userId: 0192f1a2-3b4c-7d5e-8f60-718293a4b5c6
                    step: REFUND_CREDITS
                    status: COMPENSATING
                    failureReason: null
                    retries: 0
                    deadlineAt: '2026-10-20T10:00:30Z'
                    startedAt: '2026-10-19T18:00:00Z'
                    updatedAt: '2026-10-20T10:00:00Z'
                    correlationId: 0192f3c0-1234-7abc-8def-0123456789ab
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/components.yaml#/components/responses/NotFound'
        '409':
          description: La SAGA no se puede reimpulsar (`SAGA_NOT_RETRYABLE`, p. ej. está `COMPLETED` o `COMPENSATED`).
          content:
            application/problem+json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Problem'
              examples:
                noReintentable:
                  summary: SAGA ya terminada
                  value:
                    type: https://api.bandadau.com/problems/saga-not-retryable
                    title: La SAGA no se puede reintentar
                    status: 409
                    detail: La SAGA ya terminó en estado COMPENSATED.
                    instance: /internal/v1/sagas/0192f3c1-2d3e-7f41-b263-748596a7b8c9/retry
                    code: SAGA_NOT_RETRYABLE
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736

