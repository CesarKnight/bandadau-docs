openapi: 3.1.0
info:
  title: Bandada U — events-service
  version: 1.5.0
  summary: Eventos y talleres, inscripciones y orquestación de la SAGA de inscripción.
  description: |
    API del bounded context **Eventos** (`events-service`, Java 25 + Spring Boot 4, DDD táctico,
    PostgreSQL `events_db`). Es el **orquestador SAGA** (D2) de la inscripción:
    reservar cupo (local) → debitar créditos (`wallet-service`) → emitir ticket (`ticketing-service`).

    - `registerToEvent` responde **202** con la inscripción `PENDING`: el resultado final
      (`CONFIRMED` / `FAILED`) se obtiene haciendo *polling* a `GET /registrations/{registrationId}`
      (o por notificación push). Los errores síncronos posibles son solo los del paso 1
      (`409` `EVENT_FULL`, `409` `ALREADY_REGISTERED`); los asíncronos quedan en `failureReason`
      (`INSUFFICIENT_FUNDS`, `WALLET_NOT_FOUND`, `TICKET_ISSUE_FAILED`, `TIMEOUT`, `SAGA_ABORTED`).
    - Una sola inscripción `PENDING`/`CONFIRMED` por (`eventId`, `userId`) aun ante reintentos
      o doble clic (índice único parcial + `Idempotency-Key`; RF-16, D3).
    - `cancelRegistration` (≥ 24 h antes) inicia la SAGA inversa `CANCELLATION` y responde **202**
      con la inscripción `CANCELLATION_PENDING` (RF-17).
    - Créditos siempre enteros (`int64`). Fechas ISO-8601 UTC.
    - Errores RFC 9457 (`application/problem+json`); `title`/`detail` localizados según
      `Accept-Language` (`es` por defecto) y respuesta con `Content-Language`. Todas las
      respuestas devuelven `X-Correlation-Id`.
    - Rutas `/internal/v1/**` (tag `internal`): solo red interna con `serviceAuth`; consumidas
      por `admin-gateway` e `insights-service` (MCP `list_failed_sagas`, `get_registration_stats`).

    ## Decisiones de implementación (fase 1)
    - Los reenvíos de comandos de la SAGA se hacen a 5/10/20 s dentro de la ventana de 30 s de cada paso; las compensaciones se reintentan sin límite
      (backoff 5 s ×2, tope 60 s) con alerta a los 2 min.
    - `createEvent` acepta `endsAt` opcional (posterior a `startsAt`); si no se envía, se usa `startsAt` + EVENT_DEFAULT_DURATION (2 h por defecto). `endsAt` siempre se devuelve en `Event` y `EventSummary` y viaja en el comando `issue-ticket` (`eventEndsAt`).
    - `/internal/v1/**` exige el scope del token de servicio: `GET` → `internal:read`; `POST`/`PATCH`/`PUT`/`DELETE` → `internal:write` (`403` `FORBIDDEN` si falta; D-7).

    ## Changelog
    - 1.5.0 (2026-10-16): nuevo `GET /internal/v1/stats/event-ranking` (`getEventRanking`): ranking de eventos por inscripciones, ingresos u ocupación para la herramienta MCP `get_event_ranking`. Scope `internal:read`.
    - 1.4.0 (2026-10-16): nuevo `GET /internal/v1/registrations` (`listRegistrationsInternal`): inscripciones de todos los eventos, filtrables por rango/estado/evento, más recientes primero,
      para la herramienta MCP `list_recent_registrations` (preguntas del admin como «¿quién compró el último ticket?»). Scope `internal:read`.
    - 1.3.0 (2026-10-15): D-1 `endsAt` obligatorio en la respuesta `Event` y presente en `EventSummary`, `400` `VALIDATION_FAILED` si `endsAt <= startsAt`;
      D-6 `getEventInternal` (`GET /internal/v1/events/{eventId}`, sin filtro de visibilidad); D-7 scopes `internal:read`/`internal:write` en `/internal/**`.
    - 1.2.0 (2026-10-15): consolidación fase 1 — `endsAt` opcional en `createEvent` (por defecto `startsAt` + 2 h) y en `Event`;
      filtros `organizerId` y `status` de `listEvents` dejan de ser propuestas; códigos `NOT_EVENT_ORGANIZER` (403), `MEDIA_UNAVAILABLE` (503);
      reintentos de la SAGA documentados.
    - 1.1.0 (2026-10-14): ADR-0016/D15 — `listEventsInternal` y `retrySaga`; `cancelEvent` y
      `listEventRegistrations` dejan de ser propuestas; `RegistrationFailureReason` alineado
      (`EVENT_FULL`, `TIMEOUT`, `SAGA_ABORTED`; reemplaza `SAGA_TIMEOUT`) y `SagaStep` sin `CONFIRM`.
    - 1.0.0 (2026-10-14): versión inicial contract-first (D1, D2, D3, D14).
  contact:
    name: Grupo 24 — Ingeniería de Software II
servers:
  - url: http://api.bandada.localhost/api/v1
    description: Desarrollo local (Traefik)
  - url: https://api.bandadau.com/api/v1
    description: Producción
tags:
  - name: events
    description: Eventos y talleres.
  - name: registrations
    description: Inscripciones (SAGA).
  - name: internal
    description: Endpoints internos (`/internal/v1`), solo con token de servicio.
security:
  - bearerAuth: []
paths:
  /events:
    parameters:
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    post:
      tags: [events]
      operationId: createEvent
      summary: Crear un evento
      description: |
        Crea un evento en estado `DRAFT` (UC-11, RF-14). Requiere rol `ORGANIZER`.
        `priceCredits = 0` significa evento gratuito (la SAGA salta el débito).
        `coverMediaId` debe ser una imagen propia `APPROVED` en `media-service` (`422` `MEDIA_NOT_APPROVED`;
        si `media-service` no responde, `503` `MEDIA_UNAVAILABLE`).

        Fin del evento: `endsAt` opcional; si falta, `startsAt` + 2 h (variable EVENT_DEFAULT_DURATION). Debe ser posterior a `startsAt`.
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
            examples:
              taller:
                summary: Taller pagado
                value:
                  title: Taller de Docker para principiantes
                  description: Aprende a contenerizar tu primera API. Trae tu laptop con Docker instalado.
                  coverMediaId: 0192f29f-0e1f-7a2b-bc3d-4e5f6a7b8c9d
                  startsAt: '2026-10-24T22:00:00Z'
                  endsAt: '2026-10-25T00:00:00Z'
                  venue: Auditorio de la Facultad de Ingeniería, UMSA
                  capacity: 40
                  priceCredits: 20
      responses:
        '201':
          description: Evento creado en borrador.
          headers:
            Location:
              $ref: './shared/components.yaml#/components/headers/Location'
            Idempotent-Replayed:
              $ref: './shared/components.yaml#/components/headers/IdempotentReplayed'
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
            X-Correlation-Id:
              $ref: './shared/components.yaml#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
              examples:
                borrador:
                  summary: Evento en borrador
                  value:
                    id: 0192f3b0-7c1e-7a2b-9c3d-4e5f60718293
                    organizerId: 0192f1a2-3b4c-7d5e-8f60-718293a4b5c6
                    title: Taller de Docker para principiantes
                    description: Aprende a contenerizar tu primera API. Trae tu laptop con Docker instalado.
                    coverMediaId: 0192f29f-0e1f-7a2b-bc3d-4e5f6a7b8c9d
                    coverUrl: null
                    startsAt: '2026-10-24T22:00:00Z'
                    endsAt: '2026-10-25T00:00:00Z'
                    venue: Auditorio de la Facultad de Ingeniería, UMSA
                    capacity: 40
                    seatsTaken: 0
                    seatsAvailable: 40
                    priceCredits: 20
                    status: DRAFT
                    publishedAt: null
                    createdAt: '2026-10-14T15:04:05Z'
                    updatedAt: '2026-10-14T15:04:05Z'
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/components.yaml#/components/responses/Forbidden'
        '409':
          $ref: './shared/components.yaml#/components/responses/Conflict'
        '422':
          description: '`STARTS_AT_IN_PAST`, `MEDIA_NOT_APPROVED` (portada) o `IDEMPOTENCY_KEY_REUSED`.'
          content:
            application/problem+json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Problem'
              examples:
                fechaPasada:
                  summary: Fecha en el pasado
                  value:
                    type: https://api.bandadau.com/problems/starts-at-in-past
                    title: Fecha inválida
                    status: 422
                    detail: La fecha de inicio debe ser futura.
                    instance: /api/v1/events
                    code: STARTS_AT_IN_PAST
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '429':
          $ref: './shared/components.yaml#/components/responses/TooManyRequests'
    get:
      tags: [events]
      operationId: listEvents
      summary: Listar eventos
      description: |
        Eventos ordenados por `startsAt` ascendente, filtrables por rango. Con `public=true` el
        endpoint es accesible **sin JWT** (landing) y solo devuelve eventos `PUBLISHED` con
        datos públicos. Sin `public`, requiere JWT y devuelve eventos `PUBLISHED`; un
        organizador puede ver además sus borradores con `organizerId` = su propio id.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          description: Solo eventos que empiezan desde esta fecha-hora (UTC). Por defecto, ahora.
          schema:
            type: string
            format: date-time
          example: '2026-10-14T00:00:00Z'
        - name: to
          in: query
          required: false
          description: Solo eventos que empiezan hasta esta fecha-hora (UTC).
          schema:
            type: string
            format: date-time
          example: '2026-10-31T23:59:59Z'
        - name: public
          in: query
          required: false
          description: '`true` para el listado público sin autenticación (landing).'
          schema:
            type: boolean
            default: false
        - name: organizerId
          in: query
          required: false
          description: 'Filtra por organizador. Si es el propio usuario, incluye sus `DRAFT`.'
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: 'Filtra por estado (`DRAFT` solo con `organizerId` propio).'
          schema:
            $ref: '#/components/schemas/EventStatus'
        - $ref: './shared/components.yaml#/components/parameters/Cursor'
        - $ref: './shared/components.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Página de eventos.
          headers:
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
              examples:
                proximos:
                  summary: Próximos eventos
                  value:
                    items:
                      - id: 0192f3b0-7c1e-7a2b-9c3d-4e5f60718293
                        organizerId: 0192f1a2-3b4c-7d5e-8f60-718293a4b5c6
                        title: Taller de Docker para principiantes
                        description: Aprende a contenerizar tu primera API. Trae tu laptop con Docker instalado.
                        coverMediaId: 0192f29f-0e1f-7a2b-bc3d-4e5f6a7b8c9d
                        coverUrl: http://minio.bandada.localhost/bandada-media/u/0192f29f.jpg?X-Amz-Signature=abc123
                        startsAt: '2026-10-24T22:00:00Z'
                        endsAt: '2026-10-25T00:00:00Z'
                        venue: Auditorio de la Facultad de Ingeniería, UMSA
                        capacity: 40
                        seatsTaken: 12
                        seatsAvailable: 28
                        priceCredits: 20
                        status: PUBLISHED
                        publishedAt: '2026-10-14T15:10:00Z'
                        createdAt: '2026-10-14T15:04:05Z'
                        updatedAt: '2026-10-14T16:00:00Z'
                    nextCursor: null
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'

  /events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    get:
      tags: [events]
      operationId: getEvent
      summary: Ver un evento
      description: Detalle del evento con cupos disponibles. Los `DRAFT` solo los ve su organizador.
      responses:
        '200':
          description: Evento.
          headers:
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
              examples:
                publicado:
                  $ref: '#/components/examples/EventPublished'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './shared/components.yaml#/components/responses/NotFound'

  /events/{eventId}/publish:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    post:
      tags: [events]
      operationId: publishEvent
      summary: Publicar un evento
      description: |
        El organizador publica su evento `DRAFT` → `PUBLISHED` (UC-11). Publica
        `bandada.events.event.published.v1`. Idempotente por naturaleza: publicar un evento ya
        `PUBLISHED` responde `200` sin cambios. Si quien llama no es el organizador del evento responde `403` `NOT_EVENT_ORGANIZER`.
      responses:
        '200':
          description: Evento publicado.
          headers:
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
              examples:
                publicado:
                  $ref: '#/components/examples/EventPublished'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/components.yaml#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidEventStatus'
        '422':
          description: El evento ya empezó (`STARTS_AT_IN_PAST`).
          content:
            application/problem+json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Problem'
              examples:
                pasado:
                  summary: Evento pasado
                  value:
                    type: https://api.bandadau.com/problems/starts-at-in-past
                    title: Fecha inválida
                    status: 422
                    detail: No se puede publicar un evento cuya fecha ya pasó.
                    instance: /api/v1/events/0192f3b0-7c1e-7a2b-9c3d-4e5f60718293/publish
                    code: STARTS_AT_IN_PAST
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736

  /events/{eventId}/cancel:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    post:
      tags: [events]
      operationId: cancelEvent
      summary: Cancelar un evento
      description: |
        Aceptada en D15 (ADR-0016): dispara `EventStatus.CANCELLED` y el evento
        `bandada.events.event.cancelled.v1` (D12). El organizador (o un
        `ADMIN`) cancela un evento `DRAFT`/`PUBLISHED`; se inicia una SAGA `CANCELLATION` por cada
        inscripción `CONFIRMED` (sin la restricción de 24 h) y se responde **202**. Quien no es el organizador ni `ADMIN`
        recibe `403` `NOT_EVENT_ORGANIZER`.
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelEventRequest'
            examples:
              lluvia:
                summary: Cancelación
                value:
                  reason: El auditorio no estará disponible por mantenimiento.
      responses:
        '202':
          description: Cancelación aceptada; reembolsos en curso.
          headers:
            Idempotent-Replayed:
              $ref: './shared/components.yaml#/components/headers/IdempotentReplayed'
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
            X-Correlation-Id:
              $ref: './shared/components.yaml#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
              examples:
                cancelado:
                  summary: Evento cancelado
                  value:
                    id: 0192f3b0-7c1e-7a2b-9c3d-4e5f60718293
                    organizerId: 0192f1a2-3b4c-7d5e-8f60-718293a4b5c6
                    title: Taller de Docker para principiantes
                    description: Aprende a contenerizar tu primera API. Trae tu laptop con Docker instalado.
                    coverMediaId: null
                    coverUrl: null
                    startsAt: '2026-10-24T22:00:00Z'
                    endsAt: '2026-10-25T00:00:00Z'
                    venue: Auditorio de la Facultad de Ingeniería, UMSA
                    capacity: 40
                    seatsTaken: 12
                    seatsAvailable: 28
                    priceCredits: 20
                    status: CANCELLED
                    publishedAt: '2026-10-14T15:10:00Z'
                    createdAt: '2026-10-14T15:04:05Z'
                    updatedAt: '2026-10-20T12:00:00Z'
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/components.yaml#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidEventStatus'
        '422':
          $ref: './shared/components.yaml#/components/responses/UnprocessableEntity'

  /events/{eventId}/registrations:
    parameters:
      - $ref: '#/components/parameters/EventId'
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    post:
      tags: [registrations]
      operationId: registerToEvent
      summary: Inscribirse a un evento
      description: |
        Inicia la SAGA de inscripción (UC-12, RF-15, RF-16). En una transacción local reserva
        el cupo (`seatsTaken++`) y crea la `Registration` `PENDING` + `SagaInstance STARTED`;
        luego, de forma asíncrona, debita los créditos (si `priceCredits > 0`) y emite el ticket.
        Responde **202** con la inscripción `PENDING` y `Location` para hacer *polling* con
        `getRegistration` (sugerido cada `Retry-After` segundos).
        Si ya existe una inscripción `PENDING`/`CONFIRMED` del usuario para el evento con otra
        `Idempotency-Key` → `409` `ALREADY_REGISTERED`.
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Inscripción aceptada y en proceso.
          headers:
            Location:
              $ref: './shared/components.yaml#/components/headers/Location'
            Retry-After:
              $ref: './shared/components.yaml#/components/headers/RetryAfter'
            Idempotent-Replayed:
              $ref: './shared/components.yaml#/components/headers/IdempotentReplayed'
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
            X-Correlation-Id:
              $ref: './shared/components.yaml#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
              examples:
                pendiente:
                  $ref: '#/components/examples/RegistrationPending'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './shared/components.yaml#/components/responses/NotFound'
        '409':
          description: |
            Conflicto: `EVENT_FULL` (no quedan cupos), `ALREADY_REGISTERED` (ya hay una
            inscripción activa) o `IDEMPOTENCY_IN_PROGRESS`.
          headers:
            Retry-After:
              $ref: './shared/components.yaml#/components/headers/RetryAfter'
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
          content:
            application/problem+json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Problem'
              examples:
                lleno:
                  summary: Sin cupos
                  value:
                    type: https://api.bandadau.com/problems/event-full
                    title: Evento lleno
                    status: 409
                    detail: Ya no quedan cupos para "Taller de Docker para principiantes".
                    instance: /api/v1/events/0192f3b0-7c1e-7a2b-9c3d-4e5f60718293/registrations
                    code: EVENT_FULL
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                yaInscrito:
                  summary: Ya inscrito
                  value:
                    type: https://api.bandadau.com/problems/already-registered
                    title: Ya estás inscrito
                    status: 409
                    detail: Ya tienes una inscripción activa en este evento.
                    instance: /api/v1/events/0192f3b0-7c1e-7a2b-9c3d-4e5f60718293/registrations
                    code: ALREADY_REGISTERED
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                    registrationId: 0192f3c1-2d3e-7f40-a152-637485960a1b
                enCurso:
                  summary: Petición idéntica en curso
                  value:
                    type: https://api.bandadau.com/problems/idempotency-in-progress
                    title: Petición en curso
                    status: 409
                    detail: Ya se está procesando una petición con esta Idempotency-Key. Reintenta en unos segundos.
                    instance: /api/v1/events/0192f3b0-7c1e-7a2b-9c3d-4e5f60718293/registrations
                    code: IDEMPOTENCY_IN_PROGRESS
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '422':
          description: |
            `EVENT_NOT_OPEN` (el evento no está `PUBLISHED` o ya empezó) o
            `IDEMPOTENCY_KEY_REUSED` (misma clave usada para otro evento).
          content:
            application/problem+json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Problem'
              examples:
                noAbierto:
                  summary: Evento no disponible
                  value:
                    type: https://api.bandadau.com/problems/event-not-open
                    title: Inscripciones cerradas
                    status: 422
                    detail: Este evento no acepta inscripciones (cancelado, finalizado o ya empezó).
                    instance: /api/v1/events/0192f3b0-7c1e-7a2b-9c3d-4e5f60718293/registrations
                    code: EVENT_NOT_OPEN
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
                claveReutilizada:
                  summary: Idempotency-Key reutilizada
                  value:
                    type: https://api.bandadau.com/problems/idempotency-key-reused
                    title: Clave de idempotencia reutilizada
                    status: 422
                    detail: La Idempotency-Key ya se usó con una petición diferente.
                    instance: /api/v1/events/0192f3b0-7c1e-7a2b-9c3d-4e5f60718293/registrations
                    code: IDEMPOTENCY_KEY_REUSED
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '429':
          $ref: './shared/components.yaml#/components/responses/TooManyRequests'

  /registrations/me:
    parameters:
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
