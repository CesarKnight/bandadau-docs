        updatedAt: '2026-10-14T15:30:02Z'
        confirmedAt: '2026-10-14T15:30:02Z'
        cancelledAt: null

  schemas:
    EventStatus:
      type: string
      enum: [DRAFT, PUBLISHED, CANCELLED, FINISHED]
    RegistrationStatus:
      type: string
      enum: [PENDING, CONFIRMED, FAILED, CANCELLATION_PENDING, CANCELLED]
    RegistrationFailureReason:
      type: string
      enum: [EVENT_FULL, INSUFFICIENT_FUNDS, WALLET_NOT_FOUND, TICKET_ISSUE_FAILED, TIMEOUT, SAGA_ABORTED]
      description: |
        Motivo de fallo de la SAGA (`RegistrationFailureReason`, D2, ADR-0016). `TIMEOUT` = algún
        paso superó su `deadlineAt` tras los reintentos; `SAGA_ABORTED` = la SAGA se abortó (p. ej.
        débito tardío rechazado tras el reembolso); `EVENT_FULL` solo aparece si el cupo se perdió
        entre la reserva y la confirmación (normalmente es un `409` síncrono).
    SagaStatus:
      type: string
      enum: [STARTED, AWAITING_DEBIT, AWAITING_TICKET, COMPENSATING, COMPLETED, COMPENSATED, FAILED]
    SagaType:
      type: string
      enum: [REGISTRATION, CANCELLATION]
    SagaStep:
      type: string
      enum: [RESERVE_SEAT, DEBIT_CREDITS, ISSUE_TICKET, VOID_TICKET, REFUND_CREDITS, RELEASE_SEAT]
      description: Paso actual (o último ejecutado) de la SAGA (`SagaStep`, D2, ADR-0016). La confirmación final no es un paso; se refleja en `status = COMPLETED`.

    Event:
      type: object
      required: [id, organizerId, title, description, coverMediaId, coverUrl, startsAt, endsAt, venue, capacity, seatsTaken, seatsAvailable, priceCredits, status, publishedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizerId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 5
          maxLength: 120
        description:
          type: string
          maxLength: 5000
        coverMediaId:
          type: [string, 'null']
          format: uuid
        coverUrl:
          type: [string, 'null']
          format: uri
          description: URL prefirmada (15 min) de la portada.
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          description: Fin del evento (UTC). Siempre presente; si el organizador no lo envió, `startsAt` + 2 h.
        venue:
          type: string
          maxLength: 200
        capacity:
          type: integer
          minimum: 1
          maximum: 10000
        seatsTaken:
          type: integer
          minimum: 0
        seatsAvailable:
          type: integer
          minimum: 0
          description: '`capacity - seatsTaken`.'
        priceCredits:
          $ref: './shared/components.yaml#/components/schemas/Credits'
        status:
          $ref: '#/components/schemas/EventStatus'
        publishedAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EventPage:
      allOf:
        - $ref: './shared/components.yaml#/components/schemas/CursorPageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Event'

    CreateEventRequest:
      type: object
      required: [title, description, startsAt, venue, capacity, priceCredits]
      properties:
        title:
          type: string
          minLength: 5
          maxLength: 120
        description:
          type: string
          maxLength: 5000
        coverMediaId:
          type: [string, 'null']
          format: uuid
        startsAt:
          type: string
          format: date-time
          description: Debe ser futura.
        endsAt:
          type: string
          format: date-time
          description: Fin del evento (opcional, posterior a `startsAt`; si no, `400` `VALIDATION_FAILED`). Por defecto `startsAt` + 2 h (variable EVENT_DEFAULT_DURATION).
        venue:
          type: string
          minLength: 3
          maxLength: 200
        capacity:
          type: integer
          minimum: 1
          maximum: 10000
        priceCredits:
          type: integer
          format: int64
          minimum: 0
          description: 0 = gratuito.

    CancelEventRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500

    EventSummary:
      type: object
      required: [id, title, startsAt, endsAt, venue]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        venue:
          type: string

    Registration:
      type: object
      required: [id, eventId, userId, event, status, failureReason, priceCredits, ticketId, createdAt, updatedAt, confirmedAt, cancelledAt]
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        event:
          $ref: '#/components/schemas/EventSummary'
        status:
          $ref: '#/components/schemas/RegistrationStatus'
        failureReason:
          oneOf:
            - $ref: '#/components/schemas/RegistrationFailureReason'
            - type: 'null'
        priceCredits:
          $ref: './shared/components.yaml#/components/schemas/Credits'
        ticketId:
          type: [string, 'null']
          format: uuid
          description: Ticket emitido por `ticketing-service` (cuando `CONFIRMED`).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        confirmedAt:
          type: [string, 'null']
          format: date-time
        cancelledAt:
          type: [string, 'null']
          format: date-time

    RegistrationPage:
      allOf:
        - $ref: './shared/components.yaml#/components/schemas/CursorPageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Registration'

    SagaInstance:
      type: object
      required: [id, type, registrationId, eventId, userId, step, status, failureReason, retries, deadlineAt, startedAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/SagaType'
        registrationId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        step:
          $ref: '#/components/schemas/SagaStep'
        status:
          $ref: '#/components/schemas/SagaStatus'
        failureReason:
          oneOf:
            - $ref: '#/components/schemas/RegistrationFailureReason'
            - type: 'null'
        retries:
          type: integer
          minimum: 0
          description: Reintentos del comando del paso actual (máx. 3).
        deadlineAt:
          type: [string, 'null']
          format: date-time
        startedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        correlationId:
          type: string
          format: uuid

    SagaInstancePage:
      allOf:
        - $ref: './shared/components.yaml#/components/schemas/CursorPageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SagaInstance'

    RegistrationCounts:
      type: object
      required: [pending, confirmed, failed, cancelled, creditsCollected, creditsRefunded]
      properties:
        pending:
          type: integer
          format: int64
        confirmed:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        cancelled:
          type: integer
          format: int64
        creditsCollected:
          $ref: './shared/components.yaml#/components/schemas/Credits'
        creditsRefunded:
          $ref: './shared/components.yaml#/components/schemas/Credits'

    RegistrationStats:
      type: object
      required: [from, to, groupBy, totals, series]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        groupBy:
          type: string
          enum: [day, event]
        totals:
          $ref: '#/components/schemas/RegistrationCounts'
        series:
          type: array
          items:
            allOf:
              - type: object
                required: [key, label]
                properties:
                  key:
                    type: string
                    description: Fecha (`yyyy-mm-dd`) o `eventId`, según `groupBy`.
                  label:
                    type: string
                    description: Fecha o título del evento.
              - $ref: '#/components/schemas/RegistrationCounts'

  securitySchemes:
    bearerAuth:
      $ref: './shared/components.yaml#/components/securitySchemes/bearerAuth'
    serviceAuth:
      $ref: './shared/components.yaml#/components/securitySchemes/serviceAuth'
