  /registrations/{registrationId}/cancel:
    parameters:
      - $ref: '#/components/parameters/RegistrationId'
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    post:
      tags: [registrations]
      operationId: cancelRegistration
      summary: Cancelar mi inscripción
      description: |
        Inicia la SAGA inversa `CANCELLATION` (UC-13, RF-17): anular ticket → reembolsar
        créditos → liberar cupo → `bandada.events.registration.cancelled.v1`. Solo para
        inscripciones `CONFIRMED` y hasta 24 h antes del inicio del evento (`422` `CANCELLATION_WINDOW_CLOSED` si ya pasó la ventana;
        `409` `INVALID_REGISTRATION_STATUS` si no está `CONFIRMED`).

        Responde **202** con la inscripción en estado `CANCELLATION_PENDING`; consultar el resultado con `getRegistration`.
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Cancelación aceptada y en proceso.
          headers:
            Location:
              $ref: './shared/components.yaml#/components/headers/Location'
            Retry-After:
              $ref: './shared/components.yaml#/components/headers/RetryAfter'
            Idempotent-Replayed:
              $ref: './shared/components.yaml#/components/headers/IdempotentReplayed'
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
            X-Correlation-Id:
              $ref: './shared/components.yaml#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
              examples:
                cancelando:
                  summary: Cancelación en curso
                  value:
                    id: 0192f3c1-2d3e-7f40-a152-637485960a1b
                    eventId: 0192f3b0-7c1e-7a2b-9c3d-4e5f60718293
                    userId: 0192f1a2-3b4c-7d5e-8f60-718293a4b5c6
                    event:
                      id: 0192f3b0-7c1e-7a2b-9c3d-4e5f60718293
                      title: Taller de Docker para principiantes
                      startsAt: '2026-10-24T22:00:00Z'
                      endsAt: '2026-10-25T00:00:00Z'
                      venue: Auditorio de la Facultad de Ingeniería, UMSA
                    status: CANCELLATION_PENDING
                    failureReason: null
                    priceCredits: 20
                    ticketId: 0192f3c2-9a8b-7c6d-8e5f-4a3b2c1d0e9f
                    createdAt: '2026-10-14T15:30:00Z'
                    updatedAt: '2026-10-20T10:00:00Z'
                    confirmedAt: '2026-10-14T15:30:02Z'
                    cancelledAt: null
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/components.yaml#/components/responses/NotFound'
        '409':
          description: La inscripción no está `CONFIRMED` (`INVALID_REGISTRATION_STATUS`) o `IDEMPOTENCY_IN_PROGRESS`.
          content:
            application/problem+json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Problem'
              examples:
                estadoInvalido:
                  summary: No confirmada
                  value:
                    type: https://api.bandadau.com/problems/invalid-registration-status
                    title: No se puede cancelar
                    status: 409
                    detail: Solo se pueden cancelar inscripciones confirmadas.
                    instance: /api/v1/registrations/0192f3c1-2d3e-7f40-a152-637485960a1b/cancel
                    code: INVALID_REGISTRATION_STATUS
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '422':
          description: Faltan menos de 24 h para el evento (`CANCELLATION_WINDOW_CLOSED`) o `IDEMPOTENCY_KEY_REUSED`.
          content:
            application/problem+json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Problem'
              examples:
                fueraDePlazo:
                  summary: Fuera de plazo
                  value:
                    type: https://api.bandadau.com/problems/cancellation-window-closed
                    title: Plazo de cancelación vencido
                    status: 422
                    detail: Solo puedes cancelar hasta 24 horas antes del inicio del evento.
                    instance: /api/v1/registrations/0192f3c1-2d3e-7f40-a152-637485960a1b/cancel
                    code: CANCELLATION_WINDOW_CLOSED
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '429':
          $ref: './shared/components.yaml#/components/responses/TooManyRequests'

