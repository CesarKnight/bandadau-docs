        - url: http://events-service:7004
          description: Red interna (Docker/VPC)
      security:
        - serviceAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RegistrationStatus'
        - $ref: './shared/components.yaml#/components/parameters/Cursor'
        - $ref: './shared/components.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Página de inscripciones.
          headers:
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPage'
              examples:
                confirmadas:
                  summary: Inscritos confirmados
                  value:
                    items:
                      - id: 0192f3c1-2d3e-7f40-a152-637485960a1b
                        eventId: 0192f3b0-7c1e-7a2b-9c3d-4e5f60718293
                        userId: 0192f1a2-3b4c-7d5e-8f60-718293a4b5c6
                        event:
                          id: 0192f3b0-7c1e-7a2b-9c3d-4e5f60718293
                          title: Taller de Docker para principiantes
                          startsAt: '2026-10-24T22:00:00Z'
                          endsAt: '2026-10-25T00:00:00Z'
                          venue: Auditorio de la Facultad de Ingeniería, UMSA
                        status: CONFIRMED
                        failureReason: null
                        priceCredits: 20
                        ticketId: 0192f3c2-9a8b-7c6d-8e5f-4a3b2c1d0e9f
                        createdAt: '2026-10-14T15:30:00Z'
                        updatedAt: '2026-10-14T15:30:02Z'
                        confirmedAt: '2026-10-14T15:30:02Z'
                        cancelledAt: null
                    nextCursor: null
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/components.yaml#/components/responses/Forbidden'
        '404':
          $ref: './shared/components.yaml#/components/responses/NotFound'

  /internal/v1/registrations:
    parameters:
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    get:
      tags: [internal]
      operationId: listRegistrationsInternal
      summary: Inscripciones recientes de todos los eventos (interno)
      description: |
        Lista inscripciones de **todos** los eventos, más recientes primero, para la herramienta MCP
        `list_recent_registrations` (insights-service; el panel de administración pregunta, por ejemplo,
        «¿quién compró el último ticket?»). Exige el scope `internal:read`.

        - `from`/`to` son días UTC inclusivos y se aplican sobre `confirmedAt` cuando `status=CONFIRMED`
          y sobre `createdAt` en cualquier otro caso; el orden (descendente, desempate por `id`) usa la misma columna.
        - Devuelve `userId`, no datos personales: el nombre para mostrar lo resuelve el consumidor con
          `social-service` (`getProfileNamesInternal`).
        - Paginado por cursor; `limit` máximo 50. Rango máximo 366 días.
      servers:
        - url: http://events-service:7004
          description: Red interna (Docker/VPC)
      security:
        - serviceAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          example: '2026-10-01'
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          example: '2026-10-16'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RegistrationStatus'
        - name: eventId
          in: query
          required: false
          description: Restringe a un evento.
          schema:
            type: string
            format: uuid
        - $ref: './shared/components.yaml#/components/parameters/Cursor'
        - $ref: './shared/components.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Página de inscripciones (más recientes primero).
          headers:
            Content-Language:
              $ref: './shared/components.yaml#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationPage'
              examples:
                ultimas:
                  summary: Última inscripción confirmada
                  value:
                    items:
                      - id: 0192f3c1-2d3e-7f40-a152-637485960a1b
                        eventId: 0192f3b0-7c1e-7a2b-9c3d-4e5f60718293
                        userId: 0192f1a2-3b4c-7d5e-8f60-718293a4b5c6
                        event:
                          id: 0192f3b0-7c1e-7a2b-9c3d-4e5f60718293
                          title: Taller de React Native
                          startsAt: '2026-10-24T22:00:00Z'
                          endsAt: '2026-10-25T00:00:00Z'
                          venue: Auditorio de la Facultad de Ingeniería, UMSA
                        status: CONFIRMED
                        failureReason: null
                        priceCredits: 25
                        ticketId: 0192f3c2-9a8b-7c6d-8e5f-4a3b2c1d0e9f
                        createdAt: '2026-10-16T18:32:00Z'
                        updatedAt: '2026-10-16T18:32:02Z'
                        confirmedAt: '2026-10-16T18:32:02Z'
                        cancelledAt: null
                    nextCursor: null
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/components.yaml#/components/responses/Forbidden'

  /internal/v1/stats/event-ranking:
    parameters:
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    get:
      tags: [internal]
      operationId: getEventRanking
      summary: Ranking de eventos por inscripciones, ingresos u ocupación (interno)
      description: |
        Ranking de eventos (cualquier estado excepto `DRAFT`) calculado sobre las inscripciones `CONFIRMED` cuyo `confirmedAt`
        cae en el rango (UTC, inclusivo): `REGISTRATIONS` = número, `REVENUE` = suma de `priceCredits`, `FILL_RATE` =
        inscripciones del rango / `capacity` (0–1, 4 decimales). Orden descendente por `value` (desempate por `title` y `eventId`);
        solo se listan eventos con al menos una inscripción, salvo con `ids`. Sin datos personales. Para la herramienta MCP
        `get_event_ranking`. Rango, `by`, `limit` o `ids` inválidos → `400` `VALIDATION_FAILED` (con `errors[]`, igual que `/stats/registrations`). Exige el scope `internal:read`.
      servers:
        - url: http://events-service:7004
          description: Red interna (Docker/VPC)
      security:
        - serviceAuth: []
      parameters:
        - name: from
          in: query
          required: true
          description: Inicio inclusivo (UTC) sobre `confirmedAt`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Fin inclusivo (UTC). Máximo 366 días.
          schema:
            type: string
            format: date
        - name: by
          in: query
          required: true
          schema:
            type: string
            enum: [REGISTRATIONS, REVENUE, FILL_RATE]
        - name: ids
          in: query
          required: false
          description: UUID de eventos separados por comas (1 a 50). Si se da, devuelve solo esos eventos (aunque tengan 0 inscripciones) y `limit` se ignora.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Máximo de eventos (1–50, por defecto 5).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
      responses:
        '200':
          description: Resultado.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, by, items]
                properties:
                  from: {type: string, format: date}
                  to: {type: string, format: date}
                  by: {type: string, enum: [REGISTRATIONS, REVENUE, FILL_RATE]}
                  items:
                    type: array
                    maxItems: 50
                    items:
                      type: object
                      required: [eventId, title, value, registrations, capacity, revenueCredits]
                      properties:
                        eventId: {type: string, format: uuid}
                        title: {type: string}
                        value: {type: number, description: Valor del criterio (FILL_RATE entre 0 y 1, 4 decimales).}
                        registrations: {type: integer, description: Inscripciones CONFIRMED con confirmedAt en el rango.}
                        capacity: {type: integer}
                        revenueCredits: {type: integer, format: int64, description: Suma de priceCredits de esas inscripciones.}
              example:
                from: '2026-10-01'
                to: '2026-10-16'
                by: REGISTRATIONS
                items:
                  - {eventId: 0192f3c1-2d3e-7f41-b263-748596a7b8c9, title: Hackathon UMSA, value: 9, registrations: 9, capacity: 50, revenueCredits: 45}
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/components.yaml#/components/responses/Forbidden'

components:
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 0192f3b0-7c1e-7a2b-9c3d-4e5f60718293
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: 0192f3c1-2d3e-7f40-a152-637485960a1b

  responses:
    InvalidEventStatus:
      description: El estado del evento no permite la operación (`INVALID_EVENT_STATUS`).
      content:
        application/problem+json:
          schema:
            $ref: './shared/components.yaml#/components/schemas/Problem'
          examples:
            estado:
              summary: Evento cancelado
              value:
                type: https://api.bandadau.com/problems/invalid-event-status
                title: Estado del evento no válido
                status: 409
                detail: El evento está cancelado y no puede modificarse.
                instance: /api/v1/events/0192f3b0-7c1e-7a2b-9c3d-4e5f60718293/publish
                code: INVALID_EVENT_STATUS
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736

  examples:
    EventPublished:
      summary: Evento publicado
      value:
        id: 0192f3b0-7c1e-7a2b-9c3d-4e5f60718293
        organizerId: 0192f1a2-3b4c-7d5e-8f60-718293a4b5c6
        title: Taller de Docker para principiantes
        description: Aprende a contenerizar tu primera API. Trae tu laptop con Docker instalado.
        coverMediaId: 0192f29f-0e1f-7a2b-bc3d-4e5f6a7b8c9d
        coverUrl: http://minio.bandada.localhost/bandada-media/u/0192f29f.jpg?X-Amz-Signature=abc123
        startsAt: '2026-10-24T22:00:00Z'
        endsAt: '2026-10-25T00:00:00Z'
        venue: Auditorio de la Facultad de Ingeniería, UMSA
        capacity: 40
